# Load-test overlay (dev only), applied after docker-compose.prod.yml:
#
#   COMPOSE_PROJECT_NAME=d2 docker compose -f docker-compose.yml \
#     -f docker-compose.prod.yml -f scripts/load/docker-compose.load.yml up -d
#
# PostgreSQL keeps the production settings of docker-compose.prod.yml and adds
# pg_stat_statements and I/O timing, so slow statements can be found and
# explained after a run (docs/PERFORMANCE.md). PG_SHARED_BUFFERS,
# PG_EFFECTIVE_CACHE and PG_MEMORY change the memory settings for sizing
# experiments. Not for production use.
services:
  postgres:
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE:-3GB}
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=1000
      - -c
      - password_encryption=scram-sha-256
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=5000
      - -c
      - track_io_timing=on
    deploy:
      resources:
        limits: { memory: "${PG_MEMORY:-4G}" }
