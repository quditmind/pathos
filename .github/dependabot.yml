# Weekly dependency updates, grouped per ecosystem to keep PR noise low.
# CI (including the security gate) runs on every update PR.
#
# Policy (see CONTRIBUTING.md): adopt releases at least two weeks old, hence
# the 14-day cooldown on every ecosystem. Security fixes for vulnerable
# dependencies come through Dependabot security updates, which ignore the
# cooldown.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    groups: { go: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    groups: { frontend: { patterns: ["*"] } }
    ignore:
      # TypeScript 7 replaces the compiler with a Go-based one; adoption is a
      # deliberate decision (docs/DEPENDENCIES.md), not a routine bump.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: monthly }
    cooldown: { default-days: 14 }
  - package-ecosystem: docker
    directories: [/backend, /workers/core, /deploy/caddy]
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    ignore:
      # The worker's Python minor version follows Checkov's supported
      # versions; move it deliberately after checking compatibility.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    groups: { actions: { patterns: ["*"] } }
