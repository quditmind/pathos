# Release: push a tag "vX.Y.Z" on main.
#
#   1. Runs the complete CI (unit, integration, frontend, full stack, security).
#   2. Builds the three images with VERSION=X.Y.Z and pushes them to
#      ghcr.io/<owner>/{pathos,pathos-proxy,pathos-worker-core}:X.Y.Z (+ X.Y),
#      then the family worker images (pathos-worker-<family>, built on the
#      pushed worker-core image by digest; pathos-worker-rea is a
#      standalone image and ignores CORE_IMAGE).
#      Each image carries BuildKit SBOM and max-mode provenance attestations.
#   3. Signs every image digest with cosign keyless (GitHub OIDC; the
#      signature identity is this workflow at the release tag).
#   4. Builds the PATHOS CLI for linux, darwin and windows (amd64, arm64)
#      and the JetBrains IDE plugin ZIP, writes checksums.txt (sha256) and
#      signs it with cosign sign-blob keyless (bundle checksums.txt.sigstore.json).
#   5. Creates the GitHub release with installation and verification notes
#      and the CLI binaries, plugin ZIP, checksums and signature bundle as assets.
#
# Third-party actions are pinned to commit SHAs (Dependabot updates them).
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless signing
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: pathos
            context: backend
            dockerfile: backend/Dockerfile
          - name: pathos-proxy
            context: .
            dockerfile: deploy/caddy/Dockerfile
          - name: pathos-worker-core
            context: .
            dockerfile: workers/core/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version from tag
        id: v
        env:
          NAME: ${{ matrix.name }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "version=$version"
            echo "minor=${version%.*}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${NAME}"
            # Build date = commit date, so a rebuild of the tag is reproducible.
            echo "build_date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.v.outputs.build_date }}
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.minor }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=${{ matrix.name }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign (cosign keyless)
        env:
          REF: ${{ steps.v.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REF"
      - name: Verify the signature
        env:
          REF: ${{ steps.v.outputs.image }}@${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "$REF" \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "${NAME}: ${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"

  # Family worker images extend the worker-core image of the same release.
  family-images:
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless signing
    strategy:
      fail-fast: true
      matrix:
        family: [sast, iac, sca, dast, mobile, binary, ai, fuzz, graph, rea]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version from tag
        id: v
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "version=$version"
            echo "minor=${version%.*}"
            echo "image=ghcr.io/${owner}/pathos-worker-${FAMILY}"
            echo "core=ghcr.io/${owner}/pathos-worker-core:${version}"
            echo "build_date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Pin the worker-core image (signature and digest)
        id: core
        env:
          CORE: ${{ steps.v.outputs.core }}
        run: |
          cosign verify "$CORE" \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          digest="$(docker buildx imagetools inspect "$CORE" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "ref=${CORE%:*}@${digest}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: workers/${{ matrix.family }}/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.v.outputs.build_date }}
            CORE_IMAGE=${{ steps.core.outputs.ref }}
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.minor }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=pathos-worker-${{ matrix.family }}
          sbom: true
          provenance: mode=max
      - name: Sign (cosign keyless)
        env:
          REF: ${{ steps.v.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REF"
      - name: Verify the signature
        env:
          REF: ${{ steps.v.outputs.image }}@${{ steps.build.outputs.digest }}
          FAMILY: ${{ matrix.family }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "$REF" \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "pathos-worker-${FAMILY}: ${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"

  cli:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          # No build cache in the release job: a poisoned cache entry could reach the signed binaries.
          cache: false
      # Tested and verified by the CI run above; built here with the release version.
      - name: Build the JetBrains plugin
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/gradle-jetbrains.sh buildPlugin -PpluginVersion="${version}"
          mkdir -p dist
          cp "ide/jetbrains/build/distributions/pathos-jetbrains-${version}.zip" dist/
      - name: Build the CLI
        working-directory: backend
        run: |
          version="${GITHUB_REF_NAME#v}"
          build_date="$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
          bi=pathos/internal/platform/buildinfo
          mkdir -p ../dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=""; [ "$os" = windows ] && ext=".exe"
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X ${bi}.Version=${version} -X ${bi}.Commit=${GITHUB_SHA} -X ${bi}.BuildDate=${build_date}" \
                -o "../dist/pathos_${version}_${os}_${arch}${ext}" ./cmd/pathos-cli
            done
          done
          cd ../dist && sha256sum pathos_* pathos-jetbrains-*.zip > checksums.txt && cat checksums.txt
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign the checksums (cosign keyless)
        working-directory: dist
        run: |
          cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt
          cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pathos-cli
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [images, family-images, cli]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pathos-cli
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          cat > notes.md <<EOF
          ## Install or upgrade with the signed images

          \`\`\`bash
          git clone --branch ${GITHUB_REF_NAME} https://github.com/${GITHUB_REPOSITORY}.git pathos && cd pathos
          ./deploy/scripts/install.sh          # new installs only: creates .env
          # in .env: PATHOS_IMAGE_PREFIX=ghcr.io/${owner}/  and  PATHOS_VERSION=${version}
          deploy/scripts/upgrade.sh --pull     # backup, pull, migrate, health check
          \`\`\`

          ## Verify the images

          \`\`\`bash
          for i in pathos pathos-proxy pathos-worker-core pathos-worker-sast pathos-worker-iac pathos-worker-sca pathos-worker-dast pathos-worker-mobile pathos-worker-binary pathos-worker-ai pathos-worker-fuzz pathos-worker-graph pathos-worker-rea; do
            cosign verify ghcr.io/${owner}/\$i:${version} \\
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \\
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
          \`\`\`

          ## PATHOS CLI

          Binaries for linux, darwin and windows (amd64, arm64) are attached, with \`checksums.txt\` (sha256) and its keyless signature bundle:

          \`\`\`bash
          sha256sum -c --ignore-missing checksums.txt
          cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \\
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`

          ## IDE plugins

          \`pathos-jetbrains-${version}.zip\` is the plugin for IntelliJ IDEA, GoLand, PyCharm, WebStorm and the other JetBrains IDEs (2025.3 to 2026.3); its checksum is in the signed \`checksums.txt\`. Install it with Settings → Plugins → Install Plugin from Disk ([guide](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/user-guide/ide-integration-jetbrains.md)).

          CI templates (GitHub Action, GitLab CI, Azure Pipelines, Jenkins): [CI/CD integration](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/user-guide/ci-cd-integration.md).

          Each image also carries an SBOM and SLSA provenance (\`docker buildx imagetools inspect ghcr.io/${owner}/pathos:${version} --format '{{json .SBOM}}'\`).
          Details: [CHANGELOG](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) · [Operations guide](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/OPERATIONS.md)
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$GITHUB_REF_NAME" --title "PATHOS ${version}" --notes-file notes.md --generate-notes --verify-tag $prerelease dist/*
