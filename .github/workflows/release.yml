# Release: push a tag "vX.Y.Z" on main.
#
#   1. Runs the complete CI (unit, integration, frontend, full stack, security).
#   2. Builds the three images with VERSION=X.Y.Z and pushes them to
#      ghcr.io/<owner>/{pathos,pathos-proxy,pathos-worker-core}:X.Y.Z (+ X.Y).
#      Each image carries BuildKit SBOM and max-mode provenance attestations.
#   3. Signs every image digest with cosign keyless (GitHub OIDC; the
#      signature identity is this workflow at the release tag).
#   4. Creates the GitHub release with installation and verification notes.
#
# Third-party actions are pinned to commit SHAs (Dependabot updates them).
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless signing
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: pathos
            context: backend
            dockerfile: backend/Dockerfile
          - name: pathos-proxy
            context: .
            dockerfile: deploy/caddy/Dockerfile
          - name: pathos-worker-core
            context: .
            dockerfile: workers/core/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version from tag
        id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "version=$version"
            echo "minor=${version%.*}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.minor }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=${{ matrix.name }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign (cosign keyless)
        env:
          REF: ${{ steps.v.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REF"
      - name: Verify the signature
        env:
          REF: ${{ steps.v.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          cosign verify "$REF" \
            --certificate-identity "${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "${{ matrix.name }}: ${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          cat > notes.md <<EOF
          ## Install or upgrade with the signed images

          \`\`\`bash
          git clone --branch ${GITHUB_REF_NAME} https://github.com/${GITHUB_REPOSITORY}.git pathos && cd pathos
          ./deploy/scripts/install.sh          # new installs only: creates .env
          # in .env: PATHOS_IMAGE_PREFIX=ghcr.io/${owner}/  and  PATHOS_VERSION=${version}
          deploy/scripts/upgrade.sh --pull     # backup, pull, migrate, health check
          \`\`\`

          ## Verify the images

          \`\`\`bash
          for i in pathos pathos-proxy pathos-worker-core; do
            cosign verify ghcr.io/${owner}/\$i:${version} \\
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \\
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
          \`\`\`

          Each image also carries an SBOM and SLSA provenance (\`docker buildx imagetools inspect ghcr.io/${owner}/pathos:${version} --format '{{json .SBOM}}'\`).
          Details: [CHANGELOG](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) · [Operations guide](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/OPERATIONS.md)
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$GITHUB_REF_NAME" --title "PATHOS ${version}" --notes-file notes.md --generate-notes --verify-tag $prerelease
