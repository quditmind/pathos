# PATHOS continuous integration.
#
#   backend      gofmt, go vet, unit tests with the race detector, gosec, govulncheck
#   integration  Go integration tests against PostgreSQL 18 (race detector)
#   frontend     typecheck, unit tests, production build, npm audit
#   stack        builds every image, starts the full Compose stack from a fresh
#                install, then: smoke test, Playwright browser tests, Trivy on
#                our images and an OWASP ZAP baseline (scripts/security-scan.sh)
#
# Third-party actions are pinned to commit SHAs; Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.4"
  NODE_VERSION: "26.13.1"
  GOSEC_VERSION: v2.30.0
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./... && go vet -tags integration ./test/integration/...
      - run: go test -race -count=1 ./...
      - name: gosec
        run: go run "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}" -exclude-dir=test ./...
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.7-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
        env:
          POSTGRES_PASSWORD: it
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - run: go test -race -count=1 -tags integration ./test/integration/...
        env:
          PATHOS_TEST_DATABASE_URL: postgres://postgres:it@localhost:5432/postgres?sslmode=disable

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - run: npm audit --audit-level=high

  stack:
    needs: [backend, integration, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fresh install (.env with generated secrets)
        run: PATHOS_BOOTSTRAP_ADMIN_EMAIL=admin@example.com ./deploy/scripts/install.sh
      - name: Build images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 600
      - name: Smoke test
        run: python3 scripts/smoke-test.py
      - name: Browser tests (Playwright)
        run: scripts/e2e.sh
        env:
          CI: "true"
      - name: Image scan (Trivy) and DAST baseline (ZAP)
        run: scripts/security-scan.sh --no-code
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --timestamps > compose-logs.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stack-reports
          path: |
            reports/
            e2e/playwright-report/
            e2e/test-results/
            compose-logs.txt
          if-no-files-found: ignore
          retention-days: 14
