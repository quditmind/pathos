# PATHOS continuous integration.
#
#   backend      gofmt, go vet, unit tests with the race detector, gosec, govulncheck
#   integration  Go integration tests against PostgreSQL 18 (race detector)
#   frontend     typecheck, unit tests, production build, npm audit
#   vscode-extension  typecheck, unit tests and .vsix package of ide/vscode, npm audit
#   jetbrains-plugin  unit and IntelliJ Platform tests, plugin ZIP and Plugin Verifier
#                     (two IDE versions) of ide/jetbrains, built in a pinned JDK container
#   stack        builds every image, starts the full Compose stack from a fresh
#                install, then: smoke test, Playwright browser tests, Trivy on
#                our images and an OWASP ZAP baseline (scripts/security-scan.sh);
#                outside pull requests also an authenticated active ZAP API scan
#
# Third-party actions are pinned to commit SHAs; Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly run catches new advisories (Trivy, govulncheck) and runs the DAST.
  schedule:
    - cron: "17 3 * * 1"
  # The release workflow runs the full CI before publishing anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.4"
  NODE_VERSION: "26.13.1"
  GOSEC_VERSION: v2.30.0
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./... && go vet -tags integration ./test/integration/...
      - run: go test -race -count=1 ./...
      # The worker-sca wrapper (stand-in tools; no image needed).
      - run: python3 -I ../workers/sca/test/test_pathos_sca.py
      # The CLI (unit-tested above) must build for every release platform.
      - name: Build the pathos CLI (linux, darwin, windows; amd64, arm64)
        run: |
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/pathos-cli
            done
          done
      - name: gosec
        run: go run "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}" -exclude-dir=test ./...
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  # CodeGraph discovery engine (workers/graph/discover: its own Go module,
  # cgo for tree-sitter) and the PATHOS graph rules.
  graph-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workers/graph/discover
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: workers/graph/discover/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go' | grep -v '^testdata/'))"
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - run: go vet . && go test -race -count=1 ./...
      - name: gosec
        run: go run "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}" -exclude-dir=testdata ./...
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  # Reverse-engineering analyser (workers/rea/analyse: its own Go module).
  rea-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workers/rea/analyse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: workers/rea/analyse/go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - run: go vet . && go test -race -count=1 ./...
      - name: gosec
        run: go run "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}" ./...
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.7-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
        env:
          POSTGRES_PASSWORD: it
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - run: go test -race -count=1 -tags integration ./test/integration/...
        env:
          PATHOS_TEST_DATABASE_URL: postgres://postgres:it@localhost:5432/postgres?sslmode=disable

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      # High and critical advisories fail unless excepted, with a reason and an
      # expiry of at most 30 days, in frontend/audit-exceptions.json.
      - run: node ../scripts/npm-audit-gate.mjs

  vscode-extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ide/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ide/vscode/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run package
      # Same gate as the frontend, with ide/vscode/audit-exceptions.json.
      - run: node ../../scripts/npm-audit-gate.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pathos-vscode-vsix
          path: ide/vscode/*.vsix
          if-no-files-found: error
          retention-days: 14

  jetbrains-plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Gradle (wrapper checked by distributionSha256Sum) runs in the pinned
      # eclipse-temurin container of scripts/gradle-jetbrains.sh; every
      # dependency, IDE included, is checked against
      # ide/jetbrains/gradle/verification-metadata.xml.
      # The Gradle home (Gradle, the IntelliJ Platform and the verifier's
      # IDEs, about 6 GB) is cached; the dependency checksums still apply
      # to cached files.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pathos-gradle
          key: jetbrains-gradle-${{ hashFiles('ide/jetbrains/gradle/verification-metadata.xml', 'ide/jetbrains/gradle/wrapper/gradle-wrapper.properties', 'ide/jetbrains/*.gradle.kts', 'ide/jetbrains/gradle.properties') }}
          restore-keys: jetbrains-gradle-
      - name: Build, test and package
        run: scripts/gradle-jetbrains.sh build
      - name: Plugin Verifier (IntelliJ IDEA 2025.3 and 2026.3)
        run: scripts/gradle-jetbrains.sh verifyPlugin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pathos-jetbrains-reports
          path: |
            ide/jetbrains/build/reports/tests/
            ide/jetbrains/build/reports/pluginVerifier/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pathos-jetbrains-plugin
          path: ide/jetbrains/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

  stack:
    needs: [backend, integration, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fresh install (.env with generated secrets)
        run: PATHOS_BOOTSTRAP_ADMIN_EMAIL=admin@example.com ./deploy/scripts/install.sh
      - name: Build images
        # Family worker images are opt-in profiles; build them too so the
        # image scan covers them.
        env:
          PATHOS_COMMIT: ${{ github.sha }}
        run: docker compose --profile sast --profile iac --profile sca --profile dast --profile mobile --profile binary --profile ai --profile fuzz --profile graph --profile rea build
      - name: Fuzz sandbox isolation (malicious harness in the built image)
        run: workers/fuzz/test/sandbox-e2e.sh pathos-worker-fuzz:dev
      - name: Reverse-engineering sandbox (own C, Go and firmware builds analysed in the built image; isolation probe)
        run: workers/rea/test/rea-e2e.sh pathos-worker-rea:dev
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 600
      - name: Smoke test
        run: python3 scripts/smoke-test.py
      - name: Browser tests (Playwright)
        run: scripts/e2e.sh
        env:
          CI: "true"
      - name: Image scan (Trivy) and DAST baseline (ZAP)
        run: scripts/security-scan.sh --no-code
        env:
          PATHOS_REQUIRE_FAMILY_IMAGES: "1"
      # Active, authenticated scan of every API endpoint. It modifies data, so
      # it runs on this disposable stack only, and not on pull requests (they
      # get the passive baseline). Runs on main, releases, weekly and manually.
      - name: Authenticated DAST (ZAP API scan)
        if: github.event_name != 'pull_request'
        run: |
          PATHOS_RATE_LIMIT_SCALE=0 docker compose up -d --wait api
          scripts/dast.sh --destructive-ok --minutes 20
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --timestamps > compose-logs.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stack-reports
          path: |
            reports/
            e2e/playwright-report/
            e2e/test-results/
            compose-logs.txt
          if-no-files-found: ignore
          retention-days: 14
