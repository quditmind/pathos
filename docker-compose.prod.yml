# Production overrides. Use together with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --wait
#
# (deploy/scripts/upgrade.sh and backup.sh pick this file up automatically
# when PATHOS_COMPOSE_PROD=1 is set in .env.)
#
# What changes compared to the base file:
#   - bounded log files for every service (no unbounded json logs on disk)
#   - memory and CPU limits sized for a mid-size deployment (tune below)
#   - a hot-standby scheduler replica (leader election makes this safe)
#   - the Keycloak admin console must be restricted explicitly
#   - production mode is enforced and dev-only settings are rejected
#
# Development helpers (Mailpit, the observability stack) stay off unless
# listed in COMPOSE_PROFILES; leave it empty in production.

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  proxy:
    <<: *logging
    environment:
      # Required in production: who may open /auth/admin, e.g. "10.20.0.0/16".
      KEYCLOAK_ADMIN_ALLOW: ${KEYCLOAK_ADMIN_ALLOW:?set KEYCLOAK_ADMIN_ALLOW to the admin network CIDR(s) for production}
    deploy:
      resources:
        limits: { memory: 256M, cpus: "1.0" }

  migrate:
    <<: *logging
    environment:
      PATHOS_ENV: production

  api:
    <<: *logging
    environment:
      PATHOS_ENV: production
      PATHOS_LOG_LEVEL: ${PATHOS_LOG_LEVEL:-info}
      PATHOS_SCM_ALLOW_HTTP: "false"
    deploy:
      resources:
        limits: { memory: 1G, cpus: "2.0" }

  jobs:
    <<: *logging
    environment:
      PATHOS_ENV: production
    deploy:
      resources:
        limits: { memory: 768M, cpus: "1.0" }

  scheduler:
    <<: *logging
    environment:
      PATHOS_ENV: production
    # One leader, one hot standby.
    scale: 2
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.5" }

  postgres:
    <<: *logging
    # Moderate defaults for 8-16 GB hosts; adjust to your hardware.
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=1000
      - -c
      - password_encryption=scram-sha-256
    deploy:
      resources:
        limits: { memory: 4G }

  valkey:
    <<: *logging
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1.0" }

  keycloak:
    <<: *logging
    deploy:
      resources:
        limits: { memory: 1536M, cpus: "2.0" }

  egress:
    <<: *logging
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1.0" }

  worker-core:
    <<: *logging
    # Memory is capped by PATHOS_WORKER_MEMORY in the base file (default 4g;
    # each scan needs 1-4 GB, Opengrep and Trivy at the high end).
    cpus: 4.0
