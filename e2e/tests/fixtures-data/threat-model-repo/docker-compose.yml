# Example shop stack (test fixture).
services:
  api:
    build: .
    image: example/shop-api:1.0
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://shop:${DB_PASSWORD}@postgres:5432/shop?sslmode=disable
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
