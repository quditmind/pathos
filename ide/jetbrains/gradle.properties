# Plugin version (overridden by the release workflow with -PpluginVersion=X.Y.Z).
pluginVersion=0.1.0

# Build against IntelliJ IDEA 2025.3 (build 253); compatible from 253 to 263.*.
platformVersion=2025.3
pluginSinceBuild=253
pluginUntilBuild=263.*
# Second IDE version the plugin verifier checks (the build platform is checked too).
verifierIdeVersion=2026.3

# Use the Kotlin standard library bundled with the IDE (do not ship our own).
kotlin.stdlib.default.dependency=false
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
