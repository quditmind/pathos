openapi: 3.1.0
info:
  title: PATHOS API
  version: 0.3.0
  description: |
    PATHOS REST API (Phases 1-3: identity, RBAC, organization, audit, dashboard, search, SCM connections, repositories, applications, tags, webhooks).

    **Authentication.** Browser clients authenticate through the BFF login flow
    (`GET /api/auth/login`), which sets an opaque, HttpOnly session cookie.
    OIDC tokens are never exposed to the client.

    **CSRF.** Every `POST`/`PUT`/`PATCH`/`DELETE` must send `X-CSRF-Token`
    (from `GET /api/v1/me`). If an `Origin` header is present, it must match the
    PATHOS public URL.

    **Errors.** Every error body is `{"error": {"code", "message"}, "request_id"}`.
    Unknown JSON fields are rejected with 400.

    **Pagination.** List endpoints return `{"items": [...], "next_cursor": string|null}`.
    Pass `cursor` to fetch the next page.
servers:
  - url: /
security:
  - session: []
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-pathos_session
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [unauthenticated, forbidden, not_found, invalid_request, conflict, csrf_failed, internal]
            message: { type: string }
        request_id: { type: string }
    ScopeType:
      type: string
      enum: [organization, region, business_unit, repository]
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        status: { type: string, enum: [invited, active, deactivated] }
        last_login_at: { type: [string, "null"], format: date-time }
        deactivated_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RoleAssignment:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        role_id: { type: string, format: uuid }
        role_key: { type: string }
        role_name: { type: string }
        scope_type: { $ref: "#/components/schemas/ScopeType" }
        scope_id: { type: string, format: uuid }
        scope_name: { type: string }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
    RoleGrant:
      type: object
      required: [role_key, scope_type]
      additionalProperties: false
      properties:
        role_key: { type: string, examples: [security_analyst] }
        scope_type: { $ref: "#/components/schemas/ScopeType" }
        scope_id:
          type: string
          format: uuid
          description: Required unless scope_type is organization.
    Role:
      type: object
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        description: { type: string }
        is_system: { type: boolean }
        permissions: { type: array, items: { type: string } }
    AuditRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        actor_id: { type: [string, "null"], format: uuid }
        actor_email: { type: string }
        action: { type: string, examples: [user.invite] }
        target_type: { type: string }
        target_id: { type: string }
        outcome: { type: string, enum: [success, denied, failure] }
        ip: { type: [string, "null"] }
        user_agent: { type: string }
        request_id: { type: string }
        metadata: { type: object }
        created_at: { type: string, format: date-time }
paths:
  /api/auth/login:
    get:
      summary: Start OIDC login (redirects to Keycloak)
      security: []
      parameters:
        - name: return_to
          in: query
          description: Same-origin relative path to return to after login.
          schema: { type: string }
      responses:
        "302": { description: Redirect to the identity provider }
        "503": { $ref: "#/components/responses/Error" }
  /api/auth/callback:
    get:
      summary: OIDC redirect URI (sets the session cookie)
      security: []
      responses:
        "302": { description: Redirect to return_to, or to /login?error=... on failure }
  /api/auth/logout:
    post:
      summary: End the PATHOS session
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200":
          description: The browser should navigate to logout_url to end the Keycloak session.
          content:
            application/json:
              schema:
                type: object
                properties: { logout_url: { type: string } }
  /api/v1/me:
    get:
      summary: Current user, effective permissions and CSRF token
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  permissions: { type: array, items: { type: string } }
                  org_wide_permissions: { type: [array, "null"], items: { type: string } }
                  role_assignments: { type: array, items: { $ref: "#/components/schemas/RoleAssignment" } }
                  csrf_token: { type: string }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/users:
    get:
      summary: List users (users.read, organization scope)
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Search email and display name }
        - { name: status, in: query, schema: { type: string, enum: [invited, active, deactivated] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/User" } }
                  next_cursor: { type: [string, "null"] }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Invite / provision a user (users.manage)
      description: |
        Creates the user (status `invited`) and the requested role assignments in one
        transaction, then creates the Keycloak account and sends a set-password email.
        Identity-provider failures do not roll back the PATHOS user; they are reported in `provisioning`.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                display_name: { type: string, maxLength: 200 }
                roles: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/RoleGrant" } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  role_assignments: { type: array, items: { $ref: "#/components/schemas/RoleAssignment" } }
                  provisioning:
                    type: object
                    properties:
                      status: { type: string, enum: [created, linked_existing, skipped, failed] }
                      message: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/users/{id}:
    get:
      summary: Get a user (users.read)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/users/{id}/deactivate:
    post:
      summary: Deactivate a user and revoke all sessions (users.manage)
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { description: Cannot deactivate yourself }
        "409": { description: Already deactivated, or last active super administrator }
  /api/v1/users/{id}/reactivate:
    post:
      summary: Reactivate a user (users.manage)
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "409": { description: User is not deactivated }
  /api/v1/users/{id}/role-assignments:
    get:
      summary: List a user's role assignments (roles.read)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { items: { type: array, items: { $ref: "#/components/schemas/RoleAssignment" } } }
    post:
      summary: Grant a role at a scope (roles.assign plus every permission of the role at that scope)
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RoleGrant" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/RoleAssignment" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/role-assignments/{id}:
    delete:
      summary: Revoke a role assignment (same authority as granting)
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "409": { description: Would remove the last active super administrator }
  /api/v1/roles:
    get:
      summary: List roles with permissions (roles.read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Role" } } } }
  /api/v1/permissions:
    get:
      summary: Permission catalog (roles.read)
      responses:
        "200": { description: OK }
  /api/v1/organization:
    get:
      summary: Current organization
      responses:
        "200": { description: OK }
  /api/v1/regions:
    get:
      summary: Regions with countries (org.read at any scope)
      responses:
        "200": { description: OK }
  /api/v1/business-units:
    get:
      summary: Business units (org.read at any scope)
      responses:
        "200": { description: OK }
    post:
      summary: Create a business unit (org.manage)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 200 }
                parent_id: { type: [string, "null"], format: uuid }
                description: { type: string, maxLength: 2000 }
      responses:
        "201": { description: Created }
        "409": { description: Name already used under the same parent }
  /api/v1/dashboard:
    get:
      summary: Dashboard KPIs and charts (dashboard.read)
      description: |
        Returns all 24 KPI cards and the chart panels. Each item has `status`:
        `ok` (value present), `not_yet_available` (data source arrives in roadmap `phase`)
        or `restricted` (caller lacks the permission; no value is returned).
        Values are filtered to the caller's scopes. When geo filters are set, KPIs that
        are not geo-scoped carry `org_wide: true`.
      parameters:
        - { name: days, in: query, schema: { type: integer, enum: [7, 30, 90, 365], default: 30 } }
        - { name: region_id, in: query, schema: { type: string, format: uuid } }
        - { name: country_id, in: query, schema: { type: string, format: uuid } }
        - { name: business_unit_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/search:
    get:
      summary: Global search across entities the caller may read
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
      responses:
        "200":
          description: Up to 5 results per entity type.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string, enum: [user, business_unit, region, country] }
                        id: { type: string }
                        title: { type: string }
                        subtitle: { type: string }
                        href: { type: string }
  /api/v1/audit-logs:
    get:
      summary: Audit log, newest first (audit.read)
      parameters:
        - { name: action, in: query, schema: { type: string }, description: "Exact action or prefix, e.g. `user` matches `user.invite`" }
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { name: target_type, in: query, schema: { type: string } }
        - { name: target_id, in: query, schema: { type: string } }
        - { name: outcome, in: query, schema: { type: string, enum: [success, denied, failure] } }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AuditRecord" } }
                  next_cursor: { type: [string, "null"] }
  /api/v1/scm-connections:
    get:
      summary: List SCM connections (repos.read anywhere; webhook URLs only with scm.manage). Credentials are never returned.
      responses: { "200": { description: OK } }
    post:
      summary: Create a connection (scm.manage). Credentials are envelope-encrypted; the connection is tested immediately.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, provider, auth_type]
              additionalProperties: false
              properties:
                name: { type: string }
                provider: { type: string, enum: [github, github_enterprise, azure_devops, azure_devops_server] }
                base_url: { type: string, description: "https only; loopback, link-local and (by default) private addresses are rejected" }
                auth_type: { type: string, enum: [pat, github_app] }
                owner: { type: string, description: GitHub org/user or Azure DevOps organization/project }
                token: { type: string, writeOnly: true }
                private_key: { type: string, writeOnly: true, description: GitHub App PEM }
                github_app_id: { type: integer }
                github_installation_id: { type: integer }
      responses: { "201": { description: Created }, "400": { $ref: "#/components/responses/Error" } }
  /api/v1/scm-connections/{id}:
    get: { summary: Get a connection (scm.manage), parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: OK } } }
    patch: { summary: "Rename, change owner or rotate credentials (scm.manage)", parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "200": { description: OK } } }
    delete: { summary: Delete a connection without repositories; credentials are destroyed, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: Deleted }, "409": { description: Has repositories } } }
  /api/v1/scm-connections/{id}/test:
    post: { summary: Test credentials and record status, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "200": { description: OK } } }
  /api/v1/scm-connections/{id}/webhook-secret:
    post: { summary: Generate a new webhook secret (returned once), parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "200": { description: "webhook_url and webhook_secret" } } }
  /api/v1/scm-connections/{id}/discover:
    get: { summary: "List remote repositories with import state (repos.manage anywhere)", parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: OK }, "502": { description: SCM error } } }
  /api/v1/repositories:
    get:
      summary: List repositories within the caller's repos.read scopes
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: scm_connection_id, in: query, schema: { type: string, format: uuid } }
        - { name: application_id, in: query, schema: { type: string, format: uuid } }
        - { name: business_unit_id, in: query, schema: { type: string, format: uuid }, description: Includes descendant business units }
        - { name: region_id, in: query, schema: { type: string, format: uuid } }
        - { name: country_id, in: query, schema: { type: string, format: uuid } }
        - { name: tag_id, in: query, schema: { type: string, format: uuid } }
        - { name: criticality, in: query, schema: { type: string, enum: [low, medium, high, critical] } }
        - { name: environment, in: query, schema: { type: string, enum: [production, staging, development, test, other] } }
        - { name: owner, in: query, schema: { type: string, enum: [none] } }
        - { name: status, in: query, schema: { type: string, enum: [active, archived, all], default: active } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
        - { $ref: "#/components/parameters/Cursor" }
      responses: { "200": { description: OK } }
  /api/v1/repositories/import:
    post:
      summary: Import repositories from a connection (repos.manage at each placement). Per-repository results; mandatory tags enforced.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scm_connection_id, repositories]
              properties:
                scm_connection_id: { type: string, format: uuid }
                repositories: { type: array, maxItems: 1000, items: { type: object, properties: { external_id: { type: string } } } }
                defaults: { type: object, description: "application_id, business_unit_id, country_id, environment, criticality, scan_branch, tag_ids" }
                dry_run: { type: boolean }
      responses: { "200": { description: "results[] with status imported | would_import | already_imported | error" } }
  /api/v1/repositories/import-csv:
    post:
      summary: CSV bulk onboarding (text/csv, max 2 MB). Columns repository, application, business_unit, country, environment, criticality, tags, scan_branch
      parameters:
        - { name: scm_connection_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: dry_run, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/CSRF" }
      responses: { "200": { description: Per-line results } }
  /api/v1/repositories/bulk-tags:
    post: { summary: "Add/remove tags on up to 500 repositories atomically", parameters: [{ $ref: "#/components/parameters/CSRF" }], responses: { "200": { description: OK }, "400": { description: Rule violation }, "422": { description: Mandatory tag missing } } }
  /api/v1/repositories/{id}:
    get: { summary: Get a repository (404 when out of scope), parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: OK } } }
    patch: { summary: "Update placement, classification, scan branch, technologies, tags (moves need permission at the destination)", parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "200": { description: OK } } }
    delete: { summary: Permanently delete an archived repository, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: Deleted }, "409": { description: Not archived } } }
  /api/v1/repositories/{id}/branches:
    get: { summary: Live branch list from the SCM, parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: OK } } }
  /api/v1/repositories/{id}/archive:
    post: { summary: Archive, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "200": { description: OK } } }
  /api/v1/repositories/{id}/unarchive:
    post: { summary: Unarchive, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "200": { description: OK } } }
  /api/v1/applications:
    get: { summary: Applications visible to the caller, responses: { "200": { description: OK } } }
    post: { summary: "Create (repos.manage at the business unit, or org-wide)", parameters: [{ $ref: "#/components/parameters/CSRF" }], responses: { "201": { description: Created } } }
  /api/v1/applications/{id}:
    patch: { summary: Update, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "200": { description: OK } } }
  /api/v1/applications/{id}/archive:
    post: { summary: Archive (repositories are unlinked), parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: Archived } } }
  /api/v1/tag-categories:
    get: { summary: Categories with tags and mandatory-tag compliance counts, responses: { "200": { description: OK } } }
    post: { summary: Create a category (repos.manage org-wide), parameters: [{ $ref: "#/components/parameters/CSRF" }], responses: { "201": { description: Created } } }
  /api/v1/tag-categories/{id}:
    patch: { summary: Update name / mandatory / allow_multiple, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: Updated } } }
    delete: { summary: Delete a category and its tags, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: Deleted } } }
  /api/v1/tag-categories/{id}/tags:
    post: { summary: Create a tag, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "201": { description: Created } } }
  /api/v1/tags/{id}:
    delete: { summary: Delete a tag, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: Deleted } } }
  /api/webhooks/github/{id}:
    post:
      summary: GitHub webhook receiver (no session; X-Hub-Signature-256 HMAC required; deliveries de-duplicated by X-GitHub-Delivery)
      security: []
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "202": { description: Accepted }, "200": { description: Duplicate delivery }, "401": { description: Invalid signature } }
  /api/webhooks/azure-devops/{id}:
    post:
      summary: Azure DevOps service hook receiver (Basic auth password = webhook secret)
      security: []
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "202": { description: Accepted }, "401": { description: Invalid credentials } }
