openapi: 3.1.0
info:
  title: PATHOS API
  version: 0.8.0
  description: |
    PATHOS REST API: identity, RBAC, organization, audit, dashboard, search, SCM connections, repositories,
    applications, tags, webhooks, scanning, findings and vulnerability management, AI review and MCP,
    scheduling and notifications.

    **Rate limits.** Every endpoint may answer `429 Too Many Requests` with a `Retry-After` header
    (seconds). Limits apply per user for authenticated calls (reads and writes separately), per client
    IP for login and unauthenticated calls, per connection for webhooks and per token for `/mcp`.
    See docs/OPERATIONS.md.

    **Authentication.** Browser clients authenticate through the BFF login flow
    (`GET /api/auth/login`), which sets an opaque, HttpOnly session cookie.
    OIDC tokens are never exposed to the client.

    **CSRF.** Every `POST`/`PUT`/`PATCH`/`DELETE` must send `X-CSRF-Token`
    (from `GET /api/v1/me`). If an `Origin` header is present, it must match the
    PATHOS public URL.

    **Errors.** Every error body is `{"error": {"code", "message"}, "request_id"}`.
    Unknown JSON fields are rejected with 400.

    **Pagination.** List endpoints return `{"items": [...], "next_cursor": string|null}`.
    Pass `cursor` to fetch the next page.
servers:
  - url: /
security:
  - session: []
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-pathos_session
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [unauthenticated, forbidden, not_found, invalid_request, conflict, csrf_failed, internal]
            message: { type: string }
        request_id: { type: string }
    ScopeType:
      type: string
      enum: [organization, region, business_unit, repository]
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        status: { type: string, enum: [invited, active, deactivated] }
        last_login_at: { type: [string, "null"], format: date-time }
        deactivated_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RoleAssignment:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        role_id: { type: string, format: uuid }
        role_key: { type: string }
        role_name: { type: string }
        scope_type: { $ref: "#/components/schemas/ScopeType" }
        scope_id: { type: string, format: uuid }
        scope_name: { type: string }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
    RoleGrant:
      type: object
      required: [role_key, scope_type]
      additionalProperties: false
      properties:
        role_key: { type: string, examples: [security_analyst] }
        scope_type: { $ref: "#/components/schemas/ScopeType" }
        scope_id:
          type: string
          format: uuid
          description: Required unless scope_type is organization.
    Role:
      type: object
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        description: { type: string }
        is_system: { type: boolean }
        permissions: { type: array, items: { type: string } }
    AuditRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        actor_id: { type: [string, "null"], format: uuid }
        actor_email: { type: string }
        action: { type: string, examples: [user.invite] }
        target_type: { type: string }
        target_id: { type: string }
        outcome: { type: string, enum: [success, denied, failure] }
        ip: { type: [string, "null"] }
        user_agent: { type: string }
        request_id: { type: string }
        metadata: { type: object }
        created_at: { type: string, format: date-time }
paths:
  /api/auth/login:
    get:
      summary: Start OIDC login (redirects to Keycloak)
      security: []
      parameters:
        - name: return_to
          in: query
          description: Same-origin relative path to return to after login.
          schema: { type: string }
      responses:
        "302": { description: Redirect to the identity provider }
        "503": { $ref: "#/components/responses/Error" }
  /api/auth/callback:
    get:
      summary: OIDC redirect URI (sets the session cookie)
      security: []
      responses:
        "302": { description: "Redirect to return_to, or to /login?error=... on failure" }
  /api/auth/logout:
    post:
      summary: End the PATHOS session
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200":
          description: The browser should navigate to logout_url to end the Keycloak session.
          content:
            application/json:
              schema:
                type: object
                properties: { logout_url: { type: string } }
  /api/v1/me:
    get:
      summary: Current user, effective permissions and CSRF token
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  permissions: { type: array, items: { type: string } }
                  org_wide_permissions: { type: [array, "null"], items: { type: string } }
                  role_assignments: { type: array, items: { $ref: "#/components/schemas/RoleAssignment" } }
                  csrf_token: { type: string }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/users:
    get:
      summary: List users (users.read, organization scope)
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Search email and display name }
        - { name: status, in: query, schema: { type: string, enum: [invited, active, deactivated] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/User" } }
                  next_cursor: { type: [string, "null"] }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Invite / provision a user (users.manage)
      description: |
        Creates the user (status `invited`) and the requested role assignments in one
        transaction, then creates the Keycloak account and sends a set-password email.
        Identity-provider failures do not roll back the PATHOS user; they are reported in `provisioning`.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                display_name: { type: string, maxLength: 200 }
                roles: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/RoleGrant" } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  role_assignments: { type: array, items: { $ref: "#/components/schemas/RoleAssignment" } }
                  provisioning:
                    type: object
                    properties:
                      status: { type: string, enum: [created, linked_existing, skipped, failed] }
                      message: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/users/{id}:
    get:
      summary: Get a user (users.read)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/users/{id}/deactivate:
    post:
      summary: Deactivate a user and revoke all sessions (users.manage)
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { description: Cannot deactivate yourself }
        "409": { description: Already deactivated, or last active super administrator }
  /api/v1/users/{id}/reactivate:
    post:
      summary: Reactivate a user (users.manage)
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "409": { description: User is not deactivated }
  /api/v1/users/{id}/role-assignments:
    get:
      summary: List a user's role assignments (roles.read)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { items: { type: array, items: { $ref: "#/components/schemas/RoleAssignment" } } }
    post:
      summary: Grant a role at a scope (roles.assign plus every permission of the role at that scope)
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RoleGrant" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/RoleAssignment" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/role-assignments/{id}:
    delete:
      summary: Revoke a role assignment (same authority as granting)
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "409": { description: Would remove the last active super administrator }
  /api/v1/roles:
    get:
      summary: List roles with permissions (roles.read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Role" } } } }
  /api/v1/permissions:
    get:
      summary: Permission catalog (roles.read)
      responses:
        "200": { description: OK }
  /api/v1/organization:
    get:
      summary: Current organization
      responses:
        "200": { description: OK }
  /api/v1/regions:
    get:
      summary: Regions with countries (org.read at any scope)
      responses:
        "200": { description: OK }
  /api/v1/business-units:
    get:
      summary: Business units (org.read at any scope)
      responses:
        "200": { description: OK }
    post:
      summary: Create a business unit (org.manage)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 200 }
                parent_id: { type: [string, "null"], format: uuid }
                description: { type: string, maxLength: 2000 }
      responses:
        "201": { description: Created }
        "409": { description: Name already used under the same parent }
  /api/v1/dashboard:
    get:
      summary: Dashboard KPIs and charts (dashboard.read)
      description: |
        Returns all 24 KPI cards and the chart panels. Each item has `status`:
        `ok` (value present), `not_yet_available` (data source arrives in roadmap `phase`)
        or `restricted` (caller lacks the permission; no value is returned).
        Values are filtered to the caller's scopes. When geo filters are set, KPIs that
        are not geo-scoped carry `org_wide: true`.
      parameters:
        - { name: days, in: query, schema: { type: integer, enum: [7, 30, 90, 365], default: 30 } }
        - { name: region_id, in: query, schema: { type: string, format: uuid } }
        - { name: country_id, in: query, schema: { type: string, format: uuid } }
        - { name: business_unit_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/search:
    get:
      summary: Global search across entities the caller may read
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
      responses:
        "200":
          description: Up to 5 results per entity type.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string, enum: [user, business_unit, region, country] }
                        id: { type: string }
                        title: { type: string }
                        subtitle: { type: string }
                        href: { type: string }
  /api/v1/audit-logs:
    get:
      summary: Audit log, newest first (audit.read)
      parameters:
        - { name: action, in: query, schema: { type: string }, description: "Exact action or prefix, e.g. `user` matches `user.invite`" }
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { name: target_type, in: query, schema: { type: string } }
        - { name: target_id, in: query, schema: { type: string } }
        - { name: outcome, in: query, schema: { type: string, enum: [success, denied, failure] } }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AuditRecord" } }
                  next_cursor: { type: [string, "null"] }
  /api/v1/scm-connections:
    get:
      summary: List SCM connections (repos.read anywhere; webhook URLs only with scm.manage). Credentials are never returned.
      responses: { "200": { description: OK } }
    post:
      summary: Create a connection (scm.manage). Credentials are envelope-encrypted; the connection is tested immediately.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, provider, auth_type]
              additionalProperties: false
              properties:
                name: { type: string }
                provider: { type: string, enum: [github, github_enterprise, azure_devops, azure_devops_server] }
                base_url: { type: string, description: "https only; loopback, link-local and (by default) private addresses are rejected" }
                auth_type: { type: string, enum: [pat, github_app] }
                owner: { type: string, description: GitHub org/user or Azure DevOps organization/project }
                token: { type: string, writeOnly: true }
                private_key: { type: string, writeOnly: true, description: GitHub App PEM }
                github_app_id: { type: integer }
                github_installation_id: { type: integer }
      responses: { "201": { description: Created }, "400": { $ref: "#/components/responses/Error" } }
  /api/v1/scm-connections/{id}:
    get: { summary: Get a connection (scm.manage), parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: OK } } }
    patch: { summary: "Rename, change owner or rotate credentials (scm.manage)", parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "200": { description: OK } } }
    delete: { summary: Delete a connection without repositories; credentials are destroyed, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: Deleted }, "409": { description: Has repositories } } }
  /api/v1/scm-connections/{id}/test:
    post: { summary: Test credentials and record status, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "200": { description: OK } } }
  /api/v1/scm-connections/{id}/webhook-secret:
    post: { summary: Generate a new webhook secret (returned once), parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "200": { description: "webhook_url and webhook_secret" } } }
  /api/v1/scm-connections/{id}/discover:
    get: { summary: "List remote repositories with import state (repos.manage anywhere)", parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: OK }, "502": { description: SCM error } } }
  /api/v1/repositories:
    get:
      summary: List repositories within the caller's repos.read scopes
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: scm_connection_id, in: query, schema: { type: string, format: uuid } }
        - { name: application_id, in: query, schema: { type: string, format: uuid } }
        - { name: business_unit_id, in: query, schema: { type: string, format: uuid }, description: Includes descendant business units }
        - { name: region_id, in: query, schema: { type: string, format: uuid } }
        - { name: country_id, in: query, schema: { type: string, format: uuid } }
        - { name: tag_id, in: query, schema: { type: string, format: uuid } }
        - { name: criticality, in: query, schema: { type: string, enum: [low, medium, high, critical] } }
        - { name: environment, in: query, schema: { type: string, enum: [production, staging, development, test, other] } }
        - { name: owner, in: query, schema: { type: string, enum: [none] } }
        - { name: status, in: query, schema: { type: string, enum: [active, archived, all], default: active } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
        - { $ref: "#/components/parameters/Cursor" }
      responses: { "200": { description: OK } }
  /api/v1/repositories/import:
    post:
      summary: Import repositories from a connection (repos.manage at each placement). Per-repository results; mandatory tags enforced.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scm_connection_id, repositories]
              properties:
                scm_connection_id: { type: string, format: uuid }
                repositories: { type: array, maxItems: 1000, items: { type: object, properties: { external_id: { type: string } } } }
                defaults: { type: object, description: "application_id, business_unit_id, country_id, environment, criticality, scan_branch, tag_ids" }
                dry_run: { type: boolean }
      responses: { "200": { description: "results[] with status imported | would_import | already_imported | error" } }
  /api/v1/repositories/import-csv:
    post:
      summary: CSV bulk onboarding (text/csv, max 2 MB). Columns repository, application, business_unit, country, environment, criticality, tags, scan_branch
      parameters:
        - { name: scm_connection_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: dry_run, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/CSRF" }
      responses: { "200": { description: Per-line results } }
  /api/v1/repositories/bulk-tags:
    post: { summary: "Add/remove tags on up to 500 repositories atomically", parameters: [{ $ref: "#/components/parameters/CSRF" }], responses: { "200": { description: OK }, "400": { description: Rule violation }, "422": { description: Mandatory tag missing } } }
  /api/v1/repositories/{id}:
    get: { summary: Get a repository (404 when out of scope), parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: OK } } }
    patch: { summary: "Update placement, classification, scan branch, technologies, tags (moves need permission at the destination)", parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "200": { description: OK } } }
    delete: { summary: Permanently delete an archived repository, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: Deleted }, "409": { description: Not archived } } }
  /api/v1/repositories/{id}/branches:
    get: { summary: Live branch list from the SCM, parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: OK } } }
  /api/v1/repositories/{id}/archive:
    post: { summary: Archive, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "200": { description: OK } } }
  /api/v1/repositories/{id}/unarchive:
    post: { summary: Unarchive, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "200": { description: OK } } }
  /api/v1/applications:
    get: { summary: Applications visible to the caller, responses: { "200": { description: OK } } }
    post: { summary: "Create (repos.manage at the business unit, or org-wide)", parameters: [{ $ref: "#/components/parameters/CSRF" }], responses: { "201": { description: Created } } }
  /api/v1/applications/{id}:
    patch: { summary: Update, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "200": { description: OK } } }
  /api/v1/applications/{id}/archive:
    post: { summary: Archive (repositories are unlinked), parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: Archived } } }
  /api/v1/tag-categories:
    get: { summary: Categories with tags and mandatory-tag compliance counts, responses: { "200": { description: OK } } }
    post: { summary: Create a category (repos.manage org-wide), parameters: [{ $ref: "#/components/parameters/CSRF" }], responses: { "201": { description: Created } } }
  /api/v1/tag-categories/{id}:
    patch: { summary: Update name / mandatory / allow_multiple, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: Updated } } }
    delete: { summary: Delete a category and its tags, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: Deleted } } }
  /api/v1/tag-categories/{id}/tags:
    post: { summary: Create a tag, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "201": { description: Created } } }
  /api/v1/tags/{id}:
    delete: { summary: Delete a tag, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: Deleted } } }
  /api/webhooks/github/{id}:
    post:
      summary: GitHub webhook receiver (no session; X-Hub-Signature-256 HMAC required; deliveries de-duplicated by X-GitHub-Delivery)
      security: []
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "202": { description: Accepted }, "200": { description: Duplicate delivery }, "401": { description: Invalid signature } }
  /api/webhooks/azure-devops/{id}:
    post:
      summary: Azure DevOps service hook receiver (Basic auth password = webhook secret)
      security: []
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "202": { description: Accepted }, "401": { description: Invalid credentials } }
  /api/v1/scanners:
    get: { summary: Scanner catalog (scanners.read), responses: { "200": { description: OK } } }
  /api/v1/scan-profiles:
    get: { summary: Scan profiles with current versions, responses: { "200": { description: OK } } }
    post: { summary: "Create a profile (profiles.manage). Gitleaks is added automatically.", parameters: [{ $ref: "#/components/parameters/CSRF" }], responses: { "201": { description: Created } } }
  /api/v1/scan-profiles/{id}:
    get: { summary: Profile with version history, parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: OK } } }
    put: { summary: Replace settings by creating a new immutable version, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "200": { description: OK } } }
    delete: { summary: Archive (not the default profile), parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: Archived }, "409": { description: Is default } } }
  /api/v1/scan-profiles/{id}/default:
    post: { summary: Make default, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: OK } } }
  /api/v1/repositories/{id}/scan:
    post: { summary: "Queue a scan (scans.run); coalesces into an existing queued job", parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "202": { description: "job_id, coalesced" }, "409": { description: Archived or scanning disabled } } }
  /api/v1/repositories/{id}/scan-profile:
    put: { summary: Assign a scan profile (null = organization default), parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: OK } } }
  /api/v1/scans:
    get:
      summary: Scan jobs within the caller's scans.read scope
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, queued, running, succeeded, partial, failed, cancelled] } }
        - { name: repository_id, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Cursor" }
      responses: { "200": { description: OK } }
    post: { summary: "Bulk scan up to 1000 repositories", parameters: [{ $ref: "#/components/parameters/CSRF" }], responses: { "202": { description: Per-repository results } } }
  /api/v1/scans/{id}:
    get: { summary: Job with per-scanner results, parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: OK } } }
  /api/v1/scans/{id}/cancel:
    post: { summary: Cancel a queued or running job, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: Cancelled } } }
  /api/v1/scans/{id}/results/{scanner}/artifact:
    get: { summary: Download the raw report (or SBOM for syft), parameters: [{ $ref: "#/components/parameters/Id" }, { name: scanner, in: path, required: true, schema: { type: string } }], responses: { "200": { description: Report } } }
  /api/v1/findings:
    get:
      summary: Findings within the caller's findings.read scope (default status open)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, fixed, false_positive, accepted_risk, in_progress, needs_review, all] } }
        - { name: severity, in: query, description: Comma-separated, schema: { type: string } }
        - { name: category, in: query, schema: { type: string, enum: [secrets, sast, sca, iac, container, license, other] } }
        - { name: scanner, in: query, schema: { type: string } }
        - { name: repository_id, in: query, schema: { type: string, format: uuid } }
        - { name: assignee, in: query, description: "me, none or a user id", schema: { type: string } }
        - { name: sla, in: query, schema: { type: string, enum: [breached, due_soon] } }
        - { name: q, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Cursor" }
      responses: { "200": { description: OK } }
  /api/v1/findings/summary:
    get: { summary: Counts by severity for the same filters, responses: { "200": { description: OK } } }
  /api/v1/findings/{id}:
    get: { summary: Finding with sightings, parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: OK } } }
  /api/v1/workers:
    get: { summary: Registered workers, responses: { "200": { description: OK } } }
  /api/v1/workers/{id}/revoke:
    post: { summary: Revoke a worker (scanners.manage), parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: OK } } }
  /api/v1/workers/{id}:
    delete: { summary: Delete a worker record, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: OK } } }
  # Phase 5: AI review and MCP
  /api/v1/ai/providers:
    get: { summary: AI providers (keys never returned), responses: { "200": { description: OK } } }
    post: { summary: "Create a provider (anthropic, openai, xai); the key is tested on save", parameters: [{ $ref: "#/components/parameters/CSRF" }], responses: { "201": { description: Created } } }
  /api/v1/ai/providers/{id}:
    delete: { summary: Delete a provider, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: Deleted } } }
  /api/v1/ai/providers/{id}/test:
    post: { summary: Re-test the provider key, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "200": { description: Status } } }
  /api/v1/ai/configurations:
    get: { summary: AI review configurations with versions, responses: { "200": { description: OK } } }
    post: { summary: Create a configuration (ai.configure), parameters: [{ $ref: "#/components/parameters/CSRF" }], responses: { "201": { description: Created } } }
  /api/v1/ai/configurations/{id}:
    put: { summary: New immutable configuration version, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "200": { description: OK } } }
  /api/v1/ai/reviews:
    get: { summary: AI reviews (filter status=pending_approval for the approval queue), responses: { "200": { description: OK } } }
  /api/v1/ai/reviews/{id}/approve:
    post: { summary: "Apply a review's verdict (justification required for Critical; four-eyes for interactive reviews)", parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: Applied }, "409": { description: Guardrail } } }
  /api/v1/ai/reviews/{id}/reject:
    post: { summary: Reject a review, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: Rejected } } }
  /api/v1/findings/{id}/ai-review:
    post: { summary: Queue an AI review (ai.review), parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "202": { description: Queued } } }
  /api/v1/findings/{id}/ai-reviews:
    get: { summary: Reviews of one finding, parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: OK } } }
  /api/v1/me/tokens:
    get: { summary: Caller's personal API tokens, responses: { "200": { description: OK } } }
    post: { summary: "Create a token (pathos_pat_…, 1–90 days, secret shown once)", parameters: [{ $ref: "#/components/parameters/CSRF" }], responses: { "201": { description: Created } } }
  /api/v1/me/tokens/{id}:
    delete: { summary: Revoke a token, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: Revoked } } }
  /api/v1/mcp-servers:
    get: { summary: MCP server registry, responses: { "200": { description: OK } } }
    post: { summary: Request an MCP server, parameters: [{ $ref: "#/components/parameters/CSRF" }], responses: { "201": { description: Requested } } }
  /api/v1/mcp-servers/{id}/decision:
    post: { summary: "Approve, reject or disable a server", parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: OK } } }
  /api/v1/mcp-servers/{id}/tools:
    put: { summary: Tool allow-list, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: OK } } }
  /api/v1/mcp-servers/{id}:
    delete: { summary: Delete a requested server, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: OK } } }
  /mcp:
    post: { summary: "PATHOS MCP server (JSON-RPC 2.0, Streamable HTTP). Authorization: Bearer pathos_pat_…", responses: { "200": { description: JSON-RPC response }, "401": { description: Invalid token } } }
  # Phase 6: Vulnerability management
  /api/v1/findings/{id}/status:
    post: { summary: "Change status {status, reason}; accepted_risk only through the risk-acceptance workflow; reason required for false_positive and fixed; Critical false positives need findings.accept_risk", parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: Changed }, "400": { description: Reason missing }, "409": { description: Transition not allowed } } }
  /api/v1/findings/{id}/assign:
    post: { summary: "Assign {assignee_id} (null unassigns)", parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: Assigned } } }
  /api/v1/findings/bulk:
    post: { summary: "Atomic bulk action {finding_ids, action: status|assign, status, reason, assignee_id} (max 1000)", parameters: [{ $ref: "#/components/parameters/CSRF" }], responses: { "200": { description: "updated count" } } }
  /api/v1/findings/{id}/history:
    get: { summary: Status history (append-only), parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: OK } } }
  /api/v1/findings/{id}/risk-acceptance:
    post: { summary: "Request a time-boxed risk acceptance {justification, expires_at ≤ 365 days}", parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "201": { description: Requested }, "409": { description: Already pending/active } } }
  /api/v1/risk-acceptances:
    get:
      summary: Risk acceptances in scope
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected, revoked, withdrawn, expired] } }
        - { name: finding_id, in: query, schema: { type: string, format: uuid } }
      responses: { "200": { description: OK } }
  /api/v1/risk-acceptances/{id}/{action}:
    post:
      summary: "approve | reject | revoke (findings.accept_risk; approver must differ from requester) or withdraw (requester)"
      parameters: [{ $ref: "#/components/parameters/Id" }, { name: action, in: path, required: true, schema: { type: string, enum: [approve, reject, revoke, withdraw] } }, { $ref: "#/components/parameters/CSRF" }]
      responses: { "204": { description: OK }, "409": { description: Self-approval or wrong state } }
  /api/v1/sla-policies:
    get: { summary: SLA days per severity (null = none), responses: { "200": { description: OK } } }
    put: { summary: Replace SLA days (settings.manage); recomputes open deadlines, parameters: [{ $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: Saved } } }
  /api/v1/license-policies:
    get: { summary: License policy (SPDX id → deny/review), responses: { "200": { description: OK } } }
    put: { summary: Replace the license policy (settings.manage), parameters: [{ $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: Saved } } }
  /api/v1/sbom/components:
    get:
      summary: Component inventory from the latest SBOM per repository, with license policy and open vulnerability counts
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: repository_id, in: query, schema: { type: string, format: uuid } }
        - { name: license, in: query, schema: { type: string, enum: [deny, review, violations] } }
      responses: { "200": { description: OK } }
  /api/v1/repositories/{id}/sbom:
    get: { summary: Download the latest CycloneDX SBOM, parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: application/vnd.cyclonedx+json }, "404": { description: No SBOM yet } } }
  # Phase 7: Scheduling and notifications
  /api/v1/schedules:
    get: { summary: "Scan schedules visible in the caller's scans.read scope (can_manage per item)", responses: { "200": { description: OK } } }
    post: { summary: "Create {name, cron, timezone, target_type: organization|region|business_unit|repository|profile, target_id, priority 0-90, enabled} (schedules.manage at the target; at most hourly)", parameters: [{ $ref: "#/components/parameters/CSRF" }], responses: { "201": { description: Created }, "400": { description: Invalid cron, zone, target or too frequent } } }
  /api/v1/schedules/preview:
    post: { summary: Next five runs and the number of target repositories, parameters: [{ $ref: "#/components/parameters/CSRF" }], responses: { "200": { description: OK } } }
  /api/v1/schedules/{id}:
    put: { summary: Replace a schedule (pause with enabled=false), parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "200": { description: OK } } }
    delete: { summary: Delete a schedule, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: Deleted } } }
  /api/v1/schedules/{id}/run:
    post: { summary: Queue the schedule's scans now, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "200": { description: "queued, coalesced, skipped, failed" } } }
  /api/v1/scheduler/status:
    get: { summary: "Scheduler leader and heartbeat, worker health, queue depth, missed runs", responses: { "200": { description: OK } } }
  /api/v1/scm-connections/{id}/resync:
    post: { summary: Refresh metadata of imported repositories from the SCM (scm.manage), parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "200": { description: "checked, updated, missing, archived_upstream" } } }
  /api/v1/notifications/events:
    get: { summary: Event catalog with default templates and dynamic recipients (notifications.manage), responses: { "200": { description: OK } } }
  /api/v1/notifications/smtp:
    get: { summary: SMTP settings (password never returned; has_password), responses: { "200": { description: OK } } }
    put: { summary: "Replace SMTP settings; password omitted keeps, empty clears", parameters: [{ $ref: "#/components/parameters/CSRF" }], responses: { "200": { description: OK }, "400": { description: Invalid host, address or auth without TLS } } }
  /api/v1/notifications/smtp/test:
    post: { summary: "Queue a test email {to?} (defaults to the caller); delivered by the jobs role", parameters: [{ $ref: "#/components/parameters/CSRF" }], responses: { "202": { description: "id, to" } } }
  /api/v1/notifications/rules:
    get: { summary: Notification rules, responses: { "200": { description: OK } } }
    post: { summary: "Create {name, event_key, min_severity, scope_type, scope_id, recipients: {roles, users, emails, dynamic}, email, in_app, enabled}", parameters: [{ $ref: "#/components/parameters/CSRF" }], responses: { "201": { description: Created } } }
  /api/v1/notifications/rules/{id}:
    put: { summary: Replace a rule (built-in rules keep their event), parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "200": { description: OK } } }
    delete: { summary: Delete a custom rule, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: Deleted }, "409": { description: Built-in rule } } }
  /api/v1/notifications/templates:
    get: { summary: Templates per event with defaults, responses: { "200": { description: OK } } }
  /api/v1/notifications/templates/{event}:
    put: { summary: "Override {subject, body} (Go text/template, validated on sample data)", parameters: [{ name: event, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: Saved }, "400": { description: Template error } } }
    delete: { summary: Reset to default, parameters: [{ name: event, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: Reset } } }
  /api/v1/notifications/templates/{event}/preview:
    post: { summary: Render a draft against sample data, parameters: [{ name: event, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/CSRF" }], responses: { "200": { description: "subject, body" } } }
  /api/v1/notifications/deliveries:
    get:
      summary: Delivery history (newest first, 100 per page) with 7-day email totals
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, sent, failed, suppressed] } }
        - { name: channel, in: query, schema: { type: string, enum: [email, in_app] } }
        - { name: event_key, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: before, in: query, description: next_cursor of the previous page, schema: { type: string, format: date-time } }
      responses: { "200": { description: OK } }
  /api/v1/notifications/deliveries/{id}:
    get: { summary: One delivery including its body, parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: OK } } }
  /api/v1/notifications/deliveries/{id}/retry:
    post: { summary: Retry a failed or suppressed email, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: Queued }, "409": { description: Not retryable } } }
  /api/v1/me/notifications:
    get: { summary: "Caller's in-app notifications (latest 50; ?unread=1) and unread count", responses: { "200": { description: OK } } }
  /api/v1/me/notifications/read:
    post: { summary: "Mark read {ids} or {all: true}", parameters: [{ $ref: "#/components/parameters/CSRF" }], responses: { "204": { description: OK } } }
# Internal worker API (separate listener :8081, internal network only, not
# routed by the proxy): POST /internal/worker/v1/register (bootstrap token),
# /lease, /jobs/{id}/heartbeat, /jobs/{id}/results, /jobs/{id}/complete
# (per-worker bearer token).
