AWSTemplateFormatVersion: "2010-09-09"
Description: PATHOS fixture template with deliberate misconfigurations
Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      AccessControl: PublicReadWrite
  OpenSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: open
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
  AdminUser:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: admin
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: "*"
                Resource: "*"
  Queue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 99999999
Outputs:
  Bucket:
    Value: !Ref DataBucket
