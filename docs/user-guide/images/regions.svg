<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="850" height="180" font-family="Inter, Segoe UI, Arial, sans-serif" role="img" aria-label="Business region, hosting region and data residency"><title>Business region, hosting region and data residency</title><rect width="850" height="180" fill="#ffffff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect x="20" y="30" width="250" height="100" rx="8" fill="#eef4ff" stroke="#1f5fd6" stroke-width="1.5"/><text x="145.0" y="52" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2230">Business region</text><text x="145.0" y="72" text-anchor="middle" font-size="12" fill="#4a5363">where the owning business</text><text x="145.0" y="88" text-anchor="middle" font-size="12" fill="#4a5363">operates (reporting, scope)</text><rect x="300" y="30" width="250" height="100" rx="8" fill="#f3f0ff" stroke="#8250df" stroke-width="1.5"/><text x="425.0" y="52" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2230">Hosting region</text><text x="425.0" y="72" text-anchor="middle" font-size="12" fill="#4a5363">where the application or</text><text x="425.0" y="88" text-anchor="middle" font-size="12" fill="#4a5363">its infrastructure runs</text><rect x="580" y="30" width="250" height="100" rx="8" fill="#fff8e5" stroke="#d4a72c" stroke-width="1.5"/><text x="705.0" y="52" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2230">Data residency region</text><text x="705.0" y="72" text-anchor="middle" font-size="12" fill="#4a5363">where its data must</text><text x="705.0" y="88" text-anchor="middle" font-size="12" fill="#4a5363">legally be stored</text><text x="20" y="160" font-size="12" fill="#4a5363">Example: owned by the Europe business, hosted in North America, with customer data required to stay in the EU — three different answers.</text></svg>