<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="Inter, Segoe UI, Arial, sans-serif" role="img" aria-label="Import item statuses"><title>Import item statuses</title><rect width="800" height="320" fill="#ffffff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs><rect x="20" y="40" width="140" height="80" rx="8" fill="#eef4ff" stroke="#1f5fd6" stroke-width="1.5"/><text x="90.0" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2230">Queued</text><text x="90.0" y="82" text-anchor="middle" font-size="12" fill="#4a5363">waiting for a worker</text><rect x="175" y="40" width="140" height="80" rx="8" fill="#eef4ff" stroke="#1f5fd6" stroke-width="1.5"/><text x="245.0" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2230">Validating</text><text x="245.0" y="82" text-anchor="middle" font-size="12" fill="#4a5363">access, branch,</text><text x="245.0" y="98" text-anchor="middle" font-size="12" fill="#4a5363">checksum</text><rect x="330" y="40" width="140" height="80" rx="8" fill="#eef4ff" stroke="#1f5fd6" stroke-width="1.5"/><text x="400.0" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2230">Importing</text><text x="400.0" y="82" text-anchor="middle" font-size="12" fill="#4a5363">commit, languages,</text><text x="400.0" y="98" text-anchor="middle" font-size="12" fill="#4a5363">malware, snapshot</text><rect x="485" y="40" width="140" height="80" rx="8" fill="#eef4ff" stroke="#1f5fd6" stroke-width="1.5"/><text x="555.0" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2230">Registering</text><text x="555.0" y="82" text-anchor="middle" font-size="12" fill="#4a5363">asset + metadata</text><text x="555.0" y="98" text-anchor="middle" font-size="12" fill="#4a5363">in one transaction</text><rect x="640" y="40" width="140" height="80" rx="8" fill="#eaf7ee" stroke="#2da44e" stroke-width="1.5"/><text x="710.0" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2230">Completed</text><text x="710.0" y="82" text-anchor="middle" font-size="12" fill="#4a5363">imported, already</text><text x="710.0" y="98" text-anchor="middle" font-size="12" fill="#4a5363">imported, new version</text><line x1="160" y1="80" x2="173" y2="80" stroke="#5b6474" stroke-width="1.5" marker-end="url(#a)"/><line x1="315" y1="80" x2="328" y2="80" stroke="#5b6474" stroke-width="1.5" marker-end="url(#a)"/><line x1="470" y1="80" x2="483" y2="80" stroke="#5b6474" stroke-width="1.5" marker-end="url(#a)"/><line x1="625" y1="80" x2="638" y2="80" stroke="#5b6474" stroke-width="1.5" marker-end="url(#a)"/><rect x="175" y="190" width="140" height="70" rx="8" fill="#fdecea" stroke="#cf222e" stroke-width="1.5"/><text x="245.0" y="212" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2230">Failed</text><text x="245.0" y="232" text-anchor="middle" font-size="12" fill="#4a5363">retry manually</text><rect x="380" y="190" width="160" height="70" rx="8" fill="#fff8e5" stroke="#d4a72c" stroke-width="1.5"/><text x="460.0" y="212" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2230">Needs attention</text><text x="460.0" y="232" text-anchor="middle" font-size="12" fill="#4a5363">decide: retry, import</text><text x="460.0" y="248" text-anchor="middle" font-size="12" fill="#4a5363">anyway or cancel</text><rect x="600" y="190" width="140" height="70" rx="8" fill="#f1f3f6" stroke="#6e7781" stroke-width="1.5"/><text x="670.0" y="212" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2230">Cancelled</text><text x="670.0" y="232" text-anchor="middle" font-size="12" fill="#4a5363">stopped by a user</text><line x1="400" y1="120" x2="260" y2="188" stroke="#5b6474" stroke-width="1.5" marker-end="url(#a)"/><line x1="470" y1="120" x2="460" y2="188" stroke="#5b6474" stroke-width="1.5" marker-end="url(#a)"/><line x1="555" y1="120" x2="660" y2="188" stroke="#5b6474" stroke-width="1.5" marker-end="url(#a)"/><text x="20" y="300" font-size="12" fill="#4a5363">Temporary provider or storage errors return the item to Queued with exponential backoff (up to 3 attempts).</text></svg>