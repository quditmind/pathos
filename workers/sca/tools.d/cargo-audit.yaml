# cargo-audit: known vulnerabilities, unmaintained and yanked crates in every
# Cargo.lock, with the RustSec advisory database snapshot bundled in the
# image (offline).
name: cargo-audit
display_name: cargo-audit
category: sca
scan_types: [sca]
license_spdx: "Apache-2.0 OR MIT"
homepage: https://github.com/rustsec/rustsec
family: sca
targets: [repository]
command: /opt/pathos/sca/bin/pathos-sca
version_args: ["cargo-audit", "--version"]
args: ["cargo-audit", "{source}", "{output}", "{tmp}"]
timeout: 20m
output: file
network: none
intrusive: false
requires_build: false
default_enabled: false
parser: import:cargo-audit
