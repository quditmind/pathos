# detect-secrets (Yelp): secrets in every file of the repository
# (--all-files; the tree is not a Git work tree). No plugin verifies
# secrets online. The baseline JSON on stdout is parsed with the PATHOS
# detect-secrets import parser (the hashed secrets are removed before the
# report is stored).
name: detect-secrets
display_name: detect-secrets
category: secrets
scan_types: [secrets]
license_spdx: Apache-2.0
homepage: https://github.com/Yelp/detect-secrets
family: sast
targets: [repository]
command: /opt/pathos/sast/bin/detect-secrets
version_args: ["--version"]
# -C: paths in the report are relative to the repository.
args: ["-C", "{source}", "scan", "--all-files"]
ok_exit_codes: [0]
timeout: 30m
output: stdout
network: none
intrusive: false
requires_build: false
default_enabled: false
parser: import:detect-secrets
