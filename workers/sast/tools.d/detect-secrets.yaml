# detect-secrets (Yelp): secrets in every file of the repository
# (--all-files; the tree is not a Git work tree). No plugin verifies
# secrets online. The baseline JSON on stdout is parsed with the PATHOS
# detect-secrets import parser (the hashed secrets are removed before the
# report is stored).
name: detect-secrets
display_name: detect-secrets
category: secrets
scan_types: [secrets]
license_spdx: Apache-2.0
homepage: https://github.com/Yelp/detect-secrets
family: sast
targets: [repository]
command: /opt/pathos/sast/bin/detect-secrets
version_args: ["--version"]
# -C: paths in the report are relative to the repository.
# -c 2: detect-secrets defaults to one process per host core (20 on the
# validation host); when a pool process was killed for memory the scan hung
# at 0 % CPU until the job timed out (VALIDATION_REPORT O7). The excluded
# files are the default secret exclusions (vendored code, fixtures,
# lockfiles, minified files and source maps), which the API would drop
# anyway; skipping them also keeps large bundles out of memory.
args: ["-C", "{source}", "-c", "2", "scan", "--all-files", "--exclude-files",
  '(^|/)(node_modules|bower_components|vendor|third_party|\.venv|venv|site-packages|testdata|fixtures|__fixtures__|__snapshots__)/|\.min\.(js|mjs|css)$|\.map$|(^|/)(package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|go\.sum|Cargo\.lock|composer\.lock|Gemfile\.lock|poetry\.lock|Pipfile\.lock|uv\.lock)$']
ok_exit_codes: [0]
timeout: 20m
output: stdout
network: none
intrusive: false
requires_build: false
default_enabled: false
parser: import:detect-secrets
