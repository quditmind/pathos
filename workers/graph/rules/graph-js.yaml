# PATHOS CodeGraph rules: JavaScript and TypeScript (Express, Fastify,
# Koa, NestJS, Prisma, Sequelize, TypeORM, Mongoose, pg, Redis, KafkaJS,
# amqplib, SQS, outbound HTTP). Graph facts, not findings (see
# graph-go.yaml).
rules:
  - id: pathos-graph-js-route-express
    languages: [javascript, typescript]
    severity: INFO
    message: "route|$M|$PATH|$H"
    metadata: {pathos_graph: {kind: route, framework: "koa|fastify|express", requires_import: "express|fastify|koa|@koa/router|restify|hono"}}
    patterns:
      - pattern: $APP.$M("$PATH", ..., $H)
      - metavariable-regex: {metavariable: $M, regex: ^(get|post|put|delete|patch|head|options|all)$}
  - id: pathos-graph-js-route-nest
    languages: [typescript]
    severity: INFO
    message: "route|$D|$PATH|$M"
    metadata: {pathos_graph: {kind: route, framework: nestjs}}
    patterns:
      - pattern-either:
          - pattern: |
              @$D("$PATH")
              $M(...) { ... }
          - pattern: |
              @$D()
              $M(...) { ... }
      - metavariable-regex: {metavariable: $D, regex: ^(Get|Post|Put|Delete|Patch|Head|Options|All)$}
  - id: pathos-graph-js-route-prefix-nest
    languages: [typescript]
    severity: INFO
    message: "prefix|$PATH"
    metadata: {pathos_graph: {kind: route_prefix, framework: nestjs}}
    pattern: |
      @Controller("$PATH")
      class $C { ... }
  - id: pathos-graph-js-db-prisma
    languages: [javascript, typescript]
    severity: INFO
    message: "db|$OP"
    metadata: {pathos_graph: {kind: db, technology: sql, requires_import: "@prisma/client|prisma"}}
    patterns:
      - pattern: $P.$MODEL.$OP(...)
      - metavariable-regex: {metavariable: $P, regex: (?i)prisma}
      - metavariable-regex: {metavariable: $OP, regex: ^(findMany|findUnique|findFirst|findUniqueOrThrow|findFirstOrThrow|create|createMany|update|updateMany|upsert|delete|deleteMany|count|aggregate|groupBy)$}
  - id: pathos-graph-js-db-orm
    languages: [javascript, typescript]
    severity: INFO
    message: "db|$OP"
    metadata: {pathos_graph: {kind: db, technology: sql, requires_import: "sequelize|typeorm|knex|objection|mikro-orm|drizzle-orm|models"}}
    patterns:
      - pattern: $M.$OP(...)
      - metavariable-regex: {metavariable: $OP, regex: ^(findAll|findOne|findByPk|findAndCountAll|findOneBy|findBy|findOneOrFail|bulkCreate|destroy|upsert|save|insert|createQueryBuilder|getRepository)$}
  - id: pathos-graph-js-db-mongoose
    languages: [javascript, typescript]
    severity: INFO
    message: "db|$OP"
    metadata: {pathos_graph: {kind: db, technology: mongodb, requires_import: "mongoose|mongodb"}}
    patterns:
      - pattern: $M.$OP(...)
      - metavariable-regex: {metavariable: $M, regex: '^[A-Z]|collection'}
      - metavariable-regex: {metavariable: $OP, regex: ^(find|findOne|findById|findOneAndUpdate|findByIdAndUpdate|findByIdAndDelete|insertOne|insertMany|updateOne|updateMany|deleteOne|deleteMany|aggregate|countDocuments|create)$}
  - id: pathos-graph-js-db-sql-read
    languages: [javascript, typescript]
    severity: INFO
    message: "db|$M"
    metadata: {pathos_graph: {kind: db, technology: sql, operation: read}}
    patterns:
      - pattern-either:
          - pattern: $C.$M("$SQL", ...)
          - pattern: $C.$M(`$SQL`, ...)
      - metavariable-regex: {metavariable: $M, regex: ^(query|execute|run|all|get|exec|raw|none|one|oneOrNone|many|any|manyOrNone)$}
      - metavariable-regex: {metavariable: $SQL, regex: (?is)^\s*\(?\s*(select|with|show|explain)\b}
  - id: pathos-graph-js-db-sql-write
    languages: [javascript, typescript]
    severity: INFO
    message: "db|$M"
    metadata: {pathos_graph: {kind: db, technology: sql, operation: write}}
    patterns:
      - pattern-either:
          - pattern: $C.$M("$SQL", ...)
          - pattern: $C.$M(`$SQL`, ...)
      - metavariable-regex: {metavariable: $M, regex: ^(query|execute|run|all|get|exec|raw|none|one|oneOrNone|many|any|manyOrNone)$}
      - metavariable-regex: {metavariable: $SQL, regex: (?is)^\s*\(?\s*(insert|update|delete|merge|upsert|create|alter|drop|truncate|call|copy)\b}
  - id: pathos-graph-js-db-redis
    languages: [javascript, typescript]
    severity: INFO
    message: "db|$M"
    metadata: {pathos_graph: {kind: db, technology: redis, requires_import: "redis|ioredis|valkey"}}
    patterns:
      - pattern: $R.$M(...)
      - metavariable-regex: {metavariable: $R, regex: (?i)(redis|cache|valkey)}
      - metavariable-regex: {metavariable: $M, regex: ^(get|set|setex|del|exists|expire|incr|decr|hget|hset|hgetall|lpush|rpush|lrange|sadd|smembers|zadd|zrange|mget|mset|publish|subscribe)$}
  - id: pathos-graph-js-queue-kafka-publish
    languages: [javascript, typescript]
    severity: INFO
    message: "queue|$T"
    metadata: {pathos_graph: {kind: queue_publish, technology: kafka, requires_import: "kafkajs|node-rdkafka"}}
    pattern: '$P.send({topic: "$T", ...})'
  - id: pathos-graph-js-queue-kafka-consume
    languages: [javascript, typescript]
    severity: INFO
    message: "queue|$T"
    metadata: {pathos_graph: {kind: queue_consume, technology: kafka, requires_import: "kafkajs|node-rdkafka"}}
    pattern-either:
      - pattern: '$C.subscribe({topic: "$T", ...})'
      - pattern: '$C.subscribe({topics: ["$T", ...], ...})'
  - id: pathos-graph-js-queue-amqp-publish
    languages: [javascript, typescript]
    severity: INFO
    message: "queue|$Q"
    metadata: {pathos_graph: {kind: queue_publish, technology: rabbitmq, requires_import: "amqplib|amqp-connection-manager"}}
    pattern-either:
      - pattern: $CH.sendToQueue("$Q", ...)
      - pattern: $CH.publish($EX, "$Q", ...)
  - id: pathos-graph-js-queue-amqp-consume
    languages: [javascript, typescript]
    severity: INFO
    message: "queue|$Q"
    metadata: {pathos_graph: {kind: queue_consume, technology: rabbitmq, requires_import: "amqplib|amqp-connection-manager"}}
    pattern: $CH.consume("$Q", ...)
  - id: pathos-graph-js-queue-sqs
    languages: [javascript, typescript]
    severity: INFO
    message: "queue|$M"
    metadata: {pathos_graph: {kind: queue_publish, technology: sqs, requires_import: "client-sqs|aws-sdk"}}
    pattern-either:
      - pattern: new SendMessageCommand(...)
      - pattern: new SendMessageBatchCommand(...)
  - id: pathos-graph-js-queue-sqs-consume
    languages: [javascript, typescript]
    severity: INFO
    message: "queue|$M"
    metadata: {pathos_graph: {kind: queue_consume, technology: sqs, requires_import: "client-sqs|aws-sdk"}}
    pattern: new ReceiveMessageCommand(...)
  - id: pathos-graph-js-http-call
    languages: [javascript, typescript]
    severity: INFO
    message: "http|$URL"
    metadata: {pathos_graph: {kind: external_call}}
    patterns:
      - pattern-either:
          - pattern: fetch("$URL", ...)
          - pattern: axios.$M("$URL", ...)
          - pattern: axios("$URL", ...)
          - pattern: got("$URL", ...)
          - pattern: got.$M("$URL", ...)
          - pattern: $HTTP.request("$URL", ...)
          - pattern: 'axios.create({..., baseURL: "$URL", ...})'
      - metavariable-regex: {metavariable: $URL, regex: ^https?://}
