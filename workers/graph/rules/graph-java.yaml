# PATHOS CodeGraph rules: Java (Spring, JDBC, JPA, Kafka, RabbitMQ,
# outbound HTTP). Graph facts, not findings (see graph-go.yaml).
rules:
  - id: pathos-graph-java-route-spring
    languages: [java]
    severity: INFO
    message: "route|$A|$PATH|$M"
    metadata: {pathos_graph: {kind: route, framework: spring}}
    patterns:
      - pattern-either:
          - pattern: |
              @$A("$PATH")
              $RET $M(...) { ... }
          - pattern: |
              @$A(value = "$PATH", ...)
              $RET $M(...) { ... }
          - pattern: |
              @$A(path = "$PATH", ...)
              $RET $M(...) { ... }
          - pattern: |
              @$A
              $RET $M(...) { ... }
      - metavariable-regex: {metavariable: $A, regex: ^(Get|Post|Put|Delete|Patch|Request)Mapping$}
  - id: pathos-graph-java-route-prefix-spring
    languages: [java]
    severity: INFO
    message: "prefix|$PATH"
    metadata: {pathos_graph: {kind: route_prefix, framework: spring}}
    pattern-either:
      - pattern: |
          @RequestMapping("$PATH")
          class $C { ... }
      - pattern: |
          @RequestMapping(value = "$PATH", ...)
          class $C { ... }
      - pattern: |
          @RequestMapping(path = "$PATH", ...)
          class $C { ... }
  - id: pathos-graph-java-db-jdbc-read
    languages: [java]
    severity: INFO
    message: "db|$M"
    metadata: {pathos_graph: {kind: db, technology: sql, operation: read}}
    patterns:
      - pattern-either:
          - pattern: $X.$M("$SQL", ...)
      - metavariable-regex: {metavariable: $M, regex: ^(executeQuery|executeUpdate|execute|prepareStatement|prepareCall|query|queryForObject|queryForList|queryForMap|queryForRowSet|update|batchUpdate|createQuery|createNativeQuery|sql)$}
      - metavariable-regex: {metavariable: $SQL, regex: (?is)^\s*\(?\s*(select|with|show|explain)\b}
  - id: pathos-graph-java-db-jdbc-write
    languages: [java]
    severity: INFO
    message: "db|$M"
    metadata: {pathos_graph: {kind: db, technology: sql, operation: write}}
    patterns:
      - pattern-either:
          - pattern: $X.$M("$SQL", ...)
      - metavariable-regex: {metavariable: $M, regex: ^(executeQuery|executeUpdate|execute|prepareStatement|prepareCall|query|queryForObject|queryForList|queryForMap|queryForRowSet|update|batchUpdate|createQuery|createNativeQuery|sql)$}
      - metavariable-regex: {metavariable: $SQL, regex: (?is)^\s*\(?\s*(insert|update|delete|merge|upsert|call)\b}
  - id: pathos-graph-java-db-jpa
    languages: [java]
    severity: INFO
    message: "db|$M"
    metadata: {pathos_graph: {kind: db, technology: sql, requires_import: "javax.persistence|jakarta.persistence|org.hibernate"}}
    patterns:
      - pattern: $EM.$M(...)
      - metavariable-regex: {metavariable: $M, regex: ^(persist|merge|remove|find|getReference|createQuery|createNamedQuery|createNativeQuery|flush|saveOrUpdate|save|delete)$}
  - id: pathos-graph-java-db-spring-data
    languages: [java]
    severity: INFO
    message: "db|$B"
    metadata: {pathos_graph: {kind: db, technology: sql, operation: readwrite}}
    pattern-regex: \binterface\s+\w+\s+extends\s+(?<B>JpaRepository|CrudRepository|PagingAndSortingRepository|ListCrudRepository|R2dbcRepository|ReactiveCrudRepository)\s*<
  - id: pathos-graph-java-db-mongo-repository
    languages: [java]
    severity: INFO
    message: "db|$B"
    metadata: {pathos_graph: {kind: db, technology: mongodb, operation: readwrite}}
    pattern-regex: \binterface\s+\w+\s+extends\s+(?<B>MongoRepository|ReactiveMongoRepository)\s*<
  - id: pathos-graph-java-queue-kafka-publish
    languages: [java]
    severity: INFO
    message: "queue|$TOPIC"
    metadata: {pathos_graph: {kind: queue_publish, technology: kafka, requires_import: "org.apache.kafka|org.springframework.kafka"}}
    pattern-either:
      - pattern: $T.send("$TOPIC", ...)
      - pattern: new ProducerRecord<$K, $V>("$TOPIC", ...)
      - pattern: new ProducerRecord<>("$TOPIC", ...)
  - id: pathos-graph-java-queue-kafka-listener
    languages: [java]
    severity: INFO
    message: "queue|$TOPIC"
    metadata: {pathos_graph: {kind: queue_consume, technology: kafka}}
    pattern-either:
      - pattern: |
          @KafkaListener(topics = "$TOPIC", ...)
          $RET $M(...) { ... }
      - pattern: |
          @KafkaListener(topics = {"$TOPIC", ...}, ...)
          $RET $M(...) { ... }
  - id: pathos-graph-java-queue-rabbit-publish
    languages: [java]
    severity: INFO
    message: "queue|$Q"
    metadata: {pathos_graph: {kind: queue_publish, technology: rabbitmq, requires_import: "org.springframework.amqp|com.rabbitmq"}}
    pattern-either:
      - pattern: $T.convertAndSend("$Q", ...)
      - pattern: $CH.basicPublish($EX, "$Q", ...)
  - id: pathos-graph-java-queue-rabbit-listener
    languages: [java]
    severity: INFO
    message: "queue|$Q"
    metadata: {pathos_graph: {kind: queue_consume, technology: rabbitmq}}
    pattern: |
      @RabbitListener(queues = "$Q", ...)
      $RET $M(...) { ... }
  - id: pathos-graph-java-queue-sqs
    languages: [java]
    severity: INFO
    message: "queue|$M"
    metadata: {pathos_graph: {kind: queue_publish, technology: sqs, requires_import: "services.sqs|amazonaws.services.sqs"}}
    pattern: $C.sendMessage(...)
  - id: pathos-graph-java-http-call
    languages: [java]
    severity: INFO
    message: "http|$URL"
    metadata: {pathos_graph: {kind: external_call}}
    patterns:
      - pattern-either:
          - pattern: $X.$M("$URL", ...)
          - pattern: URI.create("$URL")
          - pattern: new URL("$URL")
      - metavariable-regex: {metavariable: $URL, regex: ^https?://}
      - metavariable-regex: {metavariable: $M, regex: ^(getForObject|getForEntity|postForObject|postForEntity|patchForObject|exchange|put|delete|headForHeaders|optionsForAllow|uri|get|post|create|newBuilder|execute|baseUrl|target)$}
