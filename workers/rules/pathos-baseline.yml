# PATHOS baseline rules for Opengrep.
# Copyright PATHOS contributors. Licensed under the Apache License, Version 2.0.
# Original rules written for PATHOS; they deliberately avoid third-party rule
# sets with redistribution restrictions (see docs/ARCHITECTURE.md, D5).
# Administrators add further rule sets by mounting them at /rules.
rules:
  - id: pathos.python.eval-injection
    languages: [python]
    severity: ERROR
    message: eval() on a non-literal value can execute attacker-controlled code.
    metadata: { cwe: ["CWE-95: Eval Injection"], category: security, license: Apache-2.0 }
    patterns:
      - pattern-either:
          - pattern: eval($X)
          - pattern: exec($X)
      - pattern-not: eval("...")
      - pattern-not: exec("...")

  - id: pathos.python.subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: subprocess with shell=True enables shell injection when arguments are not constant.
    metadata: { cwe: ["CWE-78: OS Command Injection"], category: security, license: Apache-2.0 }
    patterns:
      - pattern: subprocess.$F(..., shell=True, ...)
      - pattern-not: subprocess.$F("...", ..., shell=True, ...)

  - id: pathos.python.yaml-unsafe-load
    languages: [python]
    severity: ERROR
    message: yaml.load without a safe Loader can construct arbitrary Python objects; use yaml.safe_load.
    metadata: { cwe: ["CWE-502: Deserialization of Untrusted Data"], category: security, license: Apache-2.0 }
    patterns:
      - pattern: yaml.load(...)
      - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)
      - pattern-not: yaml.load(..., Loader=SafeLoader, ...)
      - pattern-not: yaml.load(..., Loader=yaml.CSafeLoader, ...)

  - id: pathos.python.pickle-loads
    languages: [python]
    severity: WARNING
    message: Unpickling data from an untrusted source executes arbitrary code.
    metadata: { cwe: ["CWE-502: Deserialization of Untrusted Data"], category: security, license: Apache-2.0 }
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)

  - id: pathos.python.requests-verify-false
    languages: [python]
    severity: WARNING
    message: TLS certificate verification is disabled.
    metadata: { cwe: ["CWE-295: Improper Certificate Validation"], category: security, license: Apache-2.0 }
    pattern: requests.$M(..., verify=False, ...)

  - id: pathos.javascript.eval
    languages: [javascript, typescript]
    severity: ERROR
    message: eval() / new Function() on a non-literal value can execute attacker-controlled code.
    metadata: { cwe: ["CWE-95: Eval Injection"], category: security, license: Apache-2.0 }
    patterns:
      - pattern-either:
          - pattern: eval($X)
          - pattern: new Function(..., $X)
      - pattern-not: eval("...")
      - pattern-not: new Function(..., "...")

  - id: pathos.javascript.child-process-exec
    languages: [javascript, typescript]
    severity: ERROR
    message: child_process.exec runs a shell; non-constant commands enable command injection. Prefer execFile with an argument array.
    metadata: { cwe: ["CWE-78: OS Command Injection"], category: security, license: Apache-2.0 }
    patterns:
      - pattern-either:
          - pattern: require("child_process").exec($CMD, ...)
          - pattern: child_process.exec($CMD, ...)
          - pattern: childProcess.exec($CMD, ...)
          - pattern: cp.exec($CMD, ...)
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      var $EXEC = require("child_process").exec;
                      ...
                  - pattern-inside: |
                      const $EXEC = require("child_process").exec;
                      ...
                  - pattern-inside: |
                      const { exec: $EXEC } = require("child_process");
                      ...
                  - pattern-inside: |
                      import { exec as $EXEC } from "child_process";
                      ...
              - pattern: $EXEC($CMD, ...)
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      const { exec } = require("child_process");
                      ...
                  - pattern-inside: |
                      import { exec } from "child_process";
                      ...
              - pattern: exec($CMD, ...)
      - pattern-not: $X.exec("...", ...)
      - pattern-not: exec("...", ...)
      - metavariable-pattern:
          metavariable: $CMD
          patterns:
            - pattern-not: function (...) { ... }

  - id: pathos.javascript.tls-reject-unauthorized-disabled
    languages: [javascript, typescript]
    severity: ERROR
    message: Disabling NODE_TLS_REJECT_UNAUTHORIZED turns off certificate validation for the whole process.
    metadata: { cwe: ["CWE-295: Improper Certificate Validation"], category: security, license: Apache-2.0 }
    pattern-either:
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: process.env["NODE_TLS_REJECT_UNAUTHORIZED"] = "0"
      - pattern: "{..., rejectUnauthorized: false, ...}"

  - id: pathos.go.tls-insecure-skip-verify
    languages: [go]
    severity: ERROR
    message: InsecureSkipVerify disables TLS certificate verification.
    metadata: { cwe: ["CWE-295: Improper Certificate Validation"], category: security, license: Apache-2.0 }
    pattern: "tls.Config{..., InsecureSkipVerify: true, ...}"

  - id: pathos.go.sql-string-formatting
    languages: [go]
    severity: ERROR
    message: SQL built with fmt.Sprintf is vulnerable to SQL injection; use query parameters.
    metadata: { cwe: ["CWE-89: SQL Injection"], category: security, license: Apache-2.0 }
    patterns:
      - pattern-either:
          - pattern: $DB.Query(fmt.Sprintf(...), ...)
          - pattern: $DB.QueryRow(fmt.Sprintf(...), ...)
          - pattern: $DB.Exec(fmt.Sprintf(...), ...)
          - pattern: $DB.QueryContext($CTX, fmt.Sprintf(...), ...)
          - pattern: $DB.ExecContext($CTX, fmt.Sprintf(...), ...)

  - id: pathos.java.runtime-exec
    languages: [java]
    severity: WARNING
    message: Runtime.exec with non-constant input can lead to command injection.
    metadata: { cwe: ["CWE-78: OS Command Injection"], category: security, license: Apache-2.0 }
    patterns:
      - pattern: Runtime.getRuntime().exec($X)
      - pattern-not: Runtime.getRuntime().exec("...")

  - id: pathos.java.weak-hash
    languages: [java]
    severity: WARNING
    message: MD5 and SHA-1 are not collision resistant; do not use them for security purposes.
    metadata: { cwe: ["CWE-328: Use of Weak Hash"], category: security, license: Apache-2.0 }
    pattern-either:
      - pattern: MessageDigest.getInstance("MD5")
      - pattern: MessageDigest.getInstance("SHA-1")
      - pattern: MessageDigest.getInstance("SHA1")
