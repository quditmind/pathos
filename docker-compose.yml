# PATHOS - docker compose up -d
#
# Configuration comes from .env (copy .env.example or run deploy/scripts/install.sh).
# Only the edge proxy publishes ports. Data stores are on internal networks.

name: pathos

x-pathos-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  user: "65532:65532"
  restart: unless-stopped

# Repository onboarding settings shared by api and jobs
# (docs/REPOSITORY_ONBOARDING.md section 6).
x-pathos-onboarding-env: &onboarding-env
  PATHOS_SOURCE_STORE_DIR: /var/lib/pathos/sources
  PATHOS_SOURCE_S3_PREFIX: ${PATHOS_SOURCE_S3_PREFIX:-sources/}
  PATHOS_UPLOAD_MAX_BYTES: ${PATHOS_UPLOAD_MAX_BYTES:-2147483648}
  PATHOS_IMPORT_MAX_FILES: ${PATHOS_IMPORT_MAX_FILES:-200000}
  PATHOS_IMPORT_MAX_EXTRACTED_BYTES: ${PATHOS_IMPORT_MAX_EXTRACTED_BYTES:-8589934592}
  PATHOS_IMPORT_MAX_FILE_BYTES: ${PATHOS_IMPORT_MAX_FILE_BYTES:-1073741824}

# Scan workers: the core worker and the opt-in family workers share the same
# isolation (read-only, no capabilities, unprivileged user, tmpfs workspace),
# egress proxy and networks.
x-pathos-worker: &worker
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  user: "10001:10001"
  tmpfs:
    - /work:size=${PATHOS_WORKER_TMPFS:-3g},mode=0700,uid=10001,gid=10001
    - /tmp:size=1g,mode=1777
  volumes:
    - scanner_cache:/cache
    # Declarative scanner adapters (operator-defined; empty by default).
    - ./deploy/scanners.d:/etc/pathos/scanners.d:ro
    - ./workers/rules-extra:/rules:ro
  # scan: egress proxy only. worker-api: the API's worker listener only.
  # malware: clamd only (no other service is on that network).
  networks: [scan, worker-api, malware]
  mem_limit: ${PATHOS_WORKER_MEMORY:-4g}
  pids_limit: 1024
  depends_on:
    api: { condition: service_healthy }
    egress: { condition: service_healthy }

x-pathos-worker-env: &worker-env
  PATHOS_API_URL: http://api:8081
  PATHOS_WORKER_BOOTSTRAP_TOKEN: ${PATHOS_WORKER_BOOTSTRAP_TOKEN}
  # Air-gapped: only the vulnerability databases imported with
  # scripts/offline-bundle.sh are used.
  PATHOS_OFFLINE: ${PATHOS_OFFLINE:-false}
  PATHOS_LOG_LEVEL: ${PATHOS_LOG_LEVEL:-info}
  HTTPS_PROXY: http://egress:3128
  HTTP_PROXY: http://egress:3128
  https_proxy: http://egress:3128
  http_proxy: http://egress:3128
  NO_PROXY: api,clamav
  no_proxy: api,clamav
  # Malware scanning of repository content (the "clamav" scanner in a
  # scan profile): COMPOSE_PROFILES=clamav and
  # PATHOS_CLAMAV_ADDRESS=clamav:3310. Empty: the scanner is skipped.
  PATHOS_CLAMAV_ADDRESS: ${PATHOS_CLAMAV_ADDRESS:-}

x-pathos-env: &pathos-env
  PATHOS_ENV: ${PATHOS_ENV:-production}
  PATHOS_LOG_LEVEL: ${PATHOS_LOG_LEVEL:-info}
  PATHOS_DATABASE_URL: postgres://pathos_app:${PATHOS_DB_APP_PASSWORD:?run deploy/scripts/install.sh}@postgres:5432/pathos?sslmode=disable
  PATHOS_MASTER_KEY: ${PATHOS_MASTER_KEY:?run deploy/scripts/install.sh}
  PATHOS_MASTER_KEYS_PREVIOUS: ${PATHOS_MASTER_KEYS_PREVIOUS:-}
  PATHOS_ORG_NAME: ${PATHOS_ORG_NAME:-Default Organization}
  PATHOS_ORG_SLUG: ${PATHOS_ORG_SLUG:-default}
  # OpenTelemetry export (traces and metrics, OTLP/HTTP). Empty disables it.
  # COMPOSE_PROFILES=observability starts a local Grafana LGTM stack at
  # http://otel-lgtm:4318 (UI on http://127.0.0.1:3001).
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  # Scan artifacts in S3-compatible storage (empty bucket: kept in PostgreSQL).
  # COMPOSE_PROFILES=objectstore runs SeaweedFS at http://objectstore:8333.
  PATHOS_S3_ENDPOINT: ${PATHOS_S3_ENDPOINT:-}
  PATHOS_S3_REGION: ${PATHOS_S3_REGION:-us-east-1}
  PATHOS_S3_BUCKET: ${PATHOS_S3_BUCKET:-}
  PATHOS_S3_ACCESS_KEY: ${PATHOS_S3_ACCESS_KEY:-}
  PATHOS_S3_SECRET_KEY: ${PATHOS_S3_SECRET_KEY:-}

services:
  proxy:
    build:
      context: .
      dockerfile: deploy/caddy/Dockerfile
    image: ${PATHOS_IMAGE_PREFIX:-}pathos-proxy:${PATHOS_VERSION:-dev}
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    environment:
      PATHOS_DOMAIN: ${PATHOS_DOMAIN:-localhost}
      CADDY_TLS: ${CADDY_TLS:-internal}
      # Who may reach the Keycloak admin console (space-separated CIDRs).
      KEYCLOAK_ADMIN_ALLOW: ${KEYCLOAK_ADMIN_ALLOW:-private_ranges}
    ports:
      - "${PATHOS_HTTPS_PORT:-443}:443"
      - "${PATHOS_HTTP_PORT:-80}:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, app]
    depends_on:
      api: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      # The realm settings are in place before users can sign in.
      keycloak-setup: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "443"]
      interval: 15s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: backend
      args: { VERSION: "${PATHOS_VERSION:-dev}" }
    image: ${PATHOS_IMAGE_PREFIX:-}pathos:${PATHOS_VERSION:-dev}
    <<: *hardening
    restart: "no"
    entrypoint: ["/usr/local/bin/pathosctl", "migrate"]
    environment:
      <<: *pathos-env
      # Migrations run as the schema owner; the API uses pathos_app.
      PATHOS_DATABASE_URL: postgres://pathos_owner:${PATHOS_DB_OWNER_PASSWORD:?run deploy/scripts/install.sh}@postgres:5432/pathos?sslmode=disable
      # Seed the notification SMTP settings on first run (same variables as
      # Keycloak). Afterwards they are managed in Administration > Notifications.
      PATHOS_SMTP_HOST: ${PATHOS_SMTP_HOST:-mailpit}
      PATHOS_SMTP_PORT: ${PATHOS_SMTP_PORT:-1025}
      PATHOS_SMTP_FROM: ${PATHOS_SMTP_FROM:-pathos@localhost}
      PATHOS_SMTP_STARTTLS: ${PATHOS_SMTP_STARTTLS:-false}
      PATHOS_SMTP_AUTH: ${PATHOS_SMTP_AUTH:-false}
      PATHOS_SMTP_USER: ${PATHOS_SMTP_USER:-}
      PATHOS_SMTP_PASSWORD: ${PATHOS_SMTP_PASSWORD:-}
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: ${PATHOS_IMAGE_PREFIX:-}pathos:${PATHOS_VERSION:-dev}
    <<: *hardening
    environment:
      <<: [*pathos-env, *onboarding-env]
      PATHOS_ROLE: api
      PATHOS_REDIS_URL: redis://:${VALKEY_PASSWORD:?run deploy/scripts/install.sh}@valkey:6379/0
      PATHOS_PUBLIC_URL: ${PATHOS_PUBLIC_URL:-https://localhost}
      PATHOS_OIDC_ISSUER: ${PATHOS_PUBLIC_URL:-https://localhost}/auth/realms/pathos
      PATHOS_OIDC_DISCOVERY_URL: http://keycloak:8080/auth/realms/pathos
      PATHOS_OIDC_CLIENT_ID: pathos-web
      PATHOS_OIDC_CLIENT_SECRET: ${PATHOS_OIDC_CLIENT_SECRET:?run deploy/scripts/install.sh}
      PATHOS_KEYCLOAK_ADMIN_URL: http://keycloak:8080/auth
      PATHOS_KEYCLOAK_PROVISIONER_CLIENT_ID: pathos-provisioner
      PATHOS_KEYCLOAK_PROVISIONER_CLIENT_SECRET: ${PATHOS_KEYCLOAK_PROVISIONER_CLIENT_SECRET:?run deploy/scripts/install.sh}
      PATHOS_BOOTSTRAP_ADMIN_EMAIL: ${PATHOS_BOOTSTRAP_ADMIN_EMAIL:?run deploy/scripts/install.sh}
      # Self-hosted GitHub Enterprise / Azure DevOps Server on a private network.
      PATHOS_SCM_ALLOW_PRIVATE_NETWORKS: ${PATHOS_SCM_ALLOW_PRIVATE_NETWORKS:-false}
      PATHOS_OFFLINE: ${PATHOS_OFFLINE:-false}
      # Outbound proxy for SCM API calls (optional).
      HTTPS_PROXY: ${PATHOS_HTTPS_PROXY:-}
      NO_PROXY: keycloak,clamav,localhost
      PATHOS_WORKER_BOOTSTRAP_TOKEN: ${PATHOS_WORKER_BOOTSTRAP_TOKEN:?run deploy/scripts/install.sh}
      # Multiplies all API rate limits (0 disables; see docs/SECURITY.md).
      PATHOS_RATE_LIMIT_SCALE: ${PATHOS_RATE_LIMIT_SCALE:-1}
      # New users must enrol a TOTP authenticator at first login.
      PATHOS_REQUIRE_MFA: ${PATHOS_REQUIRE_MFA:-false}
      # Malware scanning of build-artifact uploads (scan targets); source
      # archives are scanned by jobs. COMPOSE_PROFILES=clamav and
      # PATHOS_CLAMAV_ADDRESS=clamav:3310.
      PATHOS_CLAMAV_ADDRESS: ${PATHOS_CLAMAV_ADDRESS:-}
      PATHOS_CLAMAV_REQUIRED: ${PATHOS_CLAMAV_REQUIRED:-false}
    # Encrypted uploads and source snapshots (shared with jobs).
    volumes:
      - sources:/var/lib/pathos/sources
    # Lets a self-hosted AI provider point at a model server running natively
    # on this host (e.g. Ollama with GPU): http://host.docker.internal:11434/v1
    extra_hosts: ["host.docker.internal:host-gateway"]
    # edge: outbound HTTPS to SCM APIs. worker-api: internal listener (:8081)
    # that scan workers use; it is not reachable through the proxy.
    networks: [app, data, edge, worker-api]
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/usr/local/bin/pathos", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  jobs:
    image: ${PATHOS_IMAGE_PREFIX:-}pathos:${PATHOS_VERSION:-dev}
    <<: *hardening
    environment:
      <<: [*pathos-env, *onboarding-env]
      PATHOS_ROLE: jobs
      PATHOS_PUBLIC_URL: ${PATHOS_PUBLIC_URL:-https://localhost}
      PATHOS_SCM_ALLOW_PRIVATE_NETWORKS: ${PATHOS_SCM_ALLOW_PRIVATE_NETWORKS:-false}
      PATHOS_OFFLINE: ${PATHOS_OFFLINE:-false}
      HTTPS_PROXY: ${PATHOS_HTTPS_PROXY:-}
      NO_PROXY: clamav,localhost
      # Repository import workers (archive processing, SCM imports).
      PATHOS_IMPORT_CONCURRENCY: ${PATHOS_IMPORT_CONCURRENCY:-2}
      PATHOS_IMPORT_TIMEOUT: ${PATHOS_IMPORT_TIMEOUT:-30m}
      PATHOS_IMPORT_WORK_DIR: /var/lib/pathos/work
      # Malware scanning of uploaded source archives: COMPOSE_PROFILES=clamav
      # and PATHOS_CLAMAV_ADDRESS=clamav:3310.
      PATHOS_CLAMAV_ADDRESS: ${PATHOS_CLAMAV_ADDRESS:-}
      PATHOS_CLAMAV_REQUIRED: ${PATHOS_CLAMAV_REQUIRED:-false}
    volumes:
      - sources:/var/lib/pathos/sources
      # Decrypted archives exist here only while one item is processed.
      - import_work:/var/lib/pathos/work
    # edge: outbound HTTPS to AI providers and SCM APIs (imports, sync,
    # OAuth token refresh) and SMTP to the relay.
    networks: [data, edge]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/usr/local/bin/pathos", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Leader-elected scan scheduler. Safe to scale: replicas wait as standbys.
  scheduler:
    image: ${PATHOS_IMAGE_PREFIX:-}pathos:${PATHOS_VERSION:-dev}
    <<: *hardening
    environment:
      <<: *pathos-env
      PATHOS_ROLE: scheduler
    networks: [data]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/usr/local/bin/pathos", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:18.7-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?run deploy/scripts/install.sh}
      PATHOS_DB_OWNER_PASSWORD: ${PATHOS_DB_OWNER_PASSWORD}
      PATHOS_DB_APP_PASSWORD: ${PATHOS_DB_APP_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?run deploy/scripts/install.sh}
    volumes:
      - pg_data:/var/lib/postgresql
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    restart: unless-stopped
    # Config is passed on stdin so the password never appears in process args.
    # Runs as the image's valkey user from the start: the entrypoint's root
    # "chown" step is skipped, so no capabilities are needed (as root without
    # DAC_OVERRIDE it could not traverse its own appendonlydir after a restart).
    user: "999:1000"
    init: true
    command: ["sh", "-c", "printf 'requirepass %s\\nappendonly yes\\nsave 60 1000\\n' \"$$VALKEY_PASSWORD\" | docker-entrypoint.sh valkey-server -"]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
      VALKEYCLI_AUTH: ${VALKEY_PASSWORD}
      REDISCLI_AUTH: ${VALKEY_PASSWORD}
    volumes:
      - redis_data:/data
    networks: [data]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot realm configuration not covered by the realm import (which runs
  # only for a new realm): MFA recovery codes. Idempotent; uses the bootstrap
  # administrator so PATHOS's service account keeps user-management rights only.
  keycloak-setup:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0
    restart: "no"
    entrypoint: ["/bin/bash", "/opt/pathos/keycloak-setup.sh"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run deploy/scripts/install.sh}
    volumes:
      - ./deploy/keycloak/setup.sh:/opt/pathos/keycloak-setup.sh:ro
    networks: [app]
    depends_on:
      keycloak: { condition: service_healthy }

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${PATHOS_PUBLIC_URL:-https://localhost}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_LOG_CONSOLE_OUTPUT: json
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run deploy/scripts/install.sh}
      # Placeholders substituted into deploy/keycloak/pathos-realm.json on import.
      PATHOS_PUBLIC_URL: ${PATHOS_PUBLIC_URL:-https://localhost}
      PATHOS_OIDC_CLIENT_SECRET: ${PATHOS_OIDC_CLIENT_SECRET}
      PATHOS_KEYCLOAK_PROVISIONER_CLIENT_SECRET: ${PATHOS_KEYCLOAK_PROVISIONER_CLIENT_SECRET}
      PATHOS_BOOTSTRAP_ADMIN_EMAIL: ${PATHOS_BOOTSTRAP_ADMIN_EMAIL}
      PATHOS_BOOTSTRAP_ADMIN_PASSWORD: ${PATHOS_BOOTSTRAP_ADMIN_PASSWORD:?run deploy/scripts/install.sh}
      PATHOS_SMTP_HOST: ${PATHOS_SMTP_HOST:-mailpit}
      PATHOS_SMTP_PORT: ${PATHOS_SMTP_PORT:-1025}
      PATHOS_SMTP_FROM: ${PATHOS_SMTP_FROM:-pathos@localhost}
    volumes:
      - ./deploy/keycloak/pathos-realm.json:/opt/keycloak/data/import/pathos-realm.json:ro
      - ./deploy/keycloak/themes/pathos:/opt/keycloak/themes/pathos:ro
    # edge: outbound access for identity federation (Entra ID, SAML IdPs).
    networks: [app, data, edge]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  egress:
    image: ubuntu/squid:7.2-26.04_edge@sha256:385450caa9d4d97cb6f98736964884918445241e1489a8eefbbc7c48086db2e3
    restart: unless-stopped
    volumes:
      - ./deploy/egress/squid.conf:/etc/squid/squid.conf:ro
      - ./deploy/egress/allowlist.txt:/etc/squid/allowlist.txt:ro
      - ./deploy/egress/conf.d:/etc/squid/conf.d:ro
      # Access log of every proxied request (audit trail of scanner egress).
      - egress_logs:/var/log/squid
    # scan: reachable by workers. edge: the only route to the internet.
    networks: [scan, edge]
    healthcheck:
      test: ["CMD", "perl", "-MIO::Socket::INET", "-e", "exit(IO::Socket::INET->new(PeerAddr => q(127.0.0.1:3128), Timeout => 2) ? 0 : 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker-core:
    <<: *worker
    build:
      context: .
      dockerfile: workers/core/Dockerfile
      args: { VERSION: "${PATHOS_VERSION:-dev}" }
    image: ${PATHOS_IMAGE_PREFIX:-}pathos-worker-core:${PATHOS_VERSION:-dev}
    environment:
      <<: *worker-env
      PATHOS_WORKER_FAMILY: core

  # Family workers (opt-in): the core image plus a family of tools defined by
  # manifests (docs/OPERATIONS.md, "Family worker images"). Jobs that use a
  # family tool go to the workers that provide it.
  #   COMPOSE_PROFILES=sast  ->  Bandit, njsscan, ShellCheck
  worker-sast:
    <<: *worker
    profiles: [sast]
    build:
      context: .
      dockerfile: workers/sast/Dockerfile
      # The family image extends the worker-core image built by this file.
      additional_contexts:
        core: service:worker-core
      args: { CORE_IMAGE: core }
    image: ${PATHOS_IMAGE_PREFIX:-}pathos-worker-sast:${PATHOS_VERSION:-dev}
    environment:
      <<: *worker-env
      PATHOS_WORKER_FAMILY: sast

  #   COMPOSE_PROFILES=iac  ->  KICS, KubeLinter, Kubescape, TFLint, Conftest,
  #   Hadolint, cfn-lint, cfn_nag, Polaris, kube-score, Trivy (config),
  #   OpenSSF Scorecard (--local)
  worker-iac:
    <<: *worker
    profiles: [iac]
    build:
      context: .
      dockerfile: workers/iac/Dockerfile
      additional_contexts:
        core: service:worker-core
      args: { CORE_IMAGE: core }
    image: ${PATHOS_IMAGE_PREFIX:-}pathos-worker-iac:${PATHOS_VERSION:-dev}
    environment:
      <<: *worker-env
      PATHOS_WORKER_FAMILY: iac

  #   COMPOSE_PROFILES=sca  ->  language-specific dependency auditors,
  #   GuardDog, dependency confusion checks, cdxgen (docs/OPERATIONS.md)
  worker-sca:
    <<: *worker
    profiles: [sca]
    build:
      context: .
      dockerfile: workers/sca/Dockerfile
      additional_contexts:
        core: service:worker-core
      args: { CORE_IMAGE: core }
    image: ${PATHOS_IMAGE_PREFIX:-}pathos-worker-sca:${PATHOS_VERSION:-dev}
    environment:
      <<: *worker-env
      PATHOS_WORKER_FAMILY: sca

  #   COMPOSE_PROFILES=dast  ->  OWASP ZAP (baseline, full and API scans), Wapiti,
  #   Dalfox, ffuf, testssl.sh, SSLyze, Schemathesis, Arjun for authorized web
  #   application and API targets (docs/user-guide/dast.md). sqlmap and Nikto
  #   only with WITH_SQLMAP=true / WITH_NIKTO=true (licence terms, see
  #   workers/dast/Dockerfile).
  worker-dast:
    <<: *worker
    profiles: [dast]
    build:
      context: .
      dockerfile: workers/dast/Dockerfile
      additional_contexts:
        core: service:worker-core
      args:
        CORE_IMAGE: core
        WITH_SQLMAP: ${PATHOS_DAST_WITH_SQLMAP:-false}
        WITH_NIKTO: ${PATHOS_DAST_WITH_NIKTO:-false}
    image: ${PATHOS_IMAGE_PREFIX:-}pathos-worker-dast:${PATHOS_VERSION:-dev}
    environment:
      <<: *worker-env
      PATHOS_WORKER_FAMILY: dast

  mailpit:
    profiles: [dev]
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    networks: [app, edge]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 3s
      retries: 5

  # S3-compatible object store for scan artifacts (opt-in).
  objectstore:
    profiles: [objectstore]
    image: chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
    restart: unless-stopped
    # Runs as the image's seaweed user (owner of /data), without capabilities.
    # The S3 identity file is written with the shell builtin printf, so the
    # keys never appear in process arguments.
    user: "1000:1000"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"pathos","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -ip=objectstore -ip.bind=0.0.0.0 -volume.max=0 -master.volumeSizeLimitMB=1024
        -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${PATHOS_S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${PATHOS_S3_SECRET_KEY:-}
    volumes:
      - s3_data:/data
    networks: [data]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9333/cluster/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Malware scanning of uploaded archives and build artifacts (opt-in). Set
  # PATHOS_CLAMAV_ADDRESS=clamav:3310; signatures update via freshclam
  # through the egress network. Needs about 2 GB of RAM.
  clamav:
    profiles: [clamav]
    image: clamav/clamav:1.5@sha256:7054e3f34308c384ea43cd786ea17abf899bd44af40af9f1b099853d7a5c214e
    restart: unless-stopped
    environment:
      CLAMD_CONF_StreamMaxLength: ${PATHOS_CLAMAV_STREAM_MAX:-4000M}
      CLAMD_CONF_MaxScanSize: ${PATHOS_CLAMAV_STREAM_MAX:-4000M}
      CLAMD_CONF_MaxFileSize: ${PATHOS_CLAMAV_MAX_FILE:-1000M}
    volumes:
      - clamav_db:/var/lib/clamav
    # data: reachable by api (build artifacts) and jobs (source archives).
    # malware: reachable by worker-core (repository content scans).
    # edge: signature downloads.
    networks: [data, edge, malware]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  # Local LLM server for self-hosted AI review (opt-in, CPU by default; add
  # docker-compose.gpu.yml for NVIDIA GPUs). Provider base URL:
  # http://ollama:11434/v1. Pull a model once:
  #   docker compose exec ollama ollama pull qwen2.5-coder:7b
  ollama:
    profiles: [ollama]
    image: ollama/ollama:0.40.13@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama_models:/root/.ollama
    # data: reachable by api/jobs only. edge: model downloads.
    networks: [data, edge]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Local observability backend (Grafana, Tempo, Prometheus/Mimir, Loki)
  # for development and evaluation. Use your own collector in production.
  otel-lgtm:
    profiles: [observability]
    image: grafana/otel-lgtm:0.39.0@sha256:4c8056c9c05fcb3c8fd93800e85334bfd79b4d0271b47a54a121a64af41fe1fe
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OTEL_LGTM_UI_PORT:-3001}:3000"
    networks: [data, edge]

networks:
  edge: {}
  app:
    internal: true
  data:
    internal: true
  worker-api:
    internal: true
  scan:
    internal: true
  # worker-core <-> clamav only: workers stream repository files to clamd
  # without joining the data network (PostgreSQL, Redis, API internals).
  malware:
    internal: true

volumes:
  sources:
  import_work:
  clamav_db:
  ollama_models:
  s3_data:
  scanner_cache:
  egress_logs:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:
