# PATHOS runtime inventory: read-only access for one cluster.
#
# Grants get, list and watch on the resources PATHOS reads, and nothing
# else: no Secrets, no ConfigMaps, no pods/log, no pods/exec, no write verb.
# PATHOS itself only issues GET list requests.
#
#   kubectl apply -f pathos-reader-clusterrole.yaml
#   kubectl -n pathos-reader get secret pathos-reader-token -o jsonpath='{.data.token}' | base64 -d
#   kubectl -n pathos-reader get secret pathos-reader-token -o jsonpath='{.data.ca\.crt}' | base64 -d
#
# Paste the token and the CA certificate into PATHOS (Runtime → Clusters →
# Add cluster, "Service-account token"). To read only some namespaces,
# replace the ClusterRoleBinding with one RoleBinding per namespace (same
# ClusterRole) and list those namespaces in PATHOS.
apiVersion: v1
kind: Namespace
metadata:
  name: pathos-reader
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pathos-reader
  namespace: pathos-reader
automountServiceAccountToken: false
---
# A long-lived token for the service account (Kubernetes 1.24+ creates
# none by default). Rotate it by deleting and re-creating this Secret, then
# paste the new token into PATHOS.
apiVersion: v1
kind: Secret
metadata:
  name: pathos-reader-token
  namespace: pathos-reader
  annotations:
    kubernetes.io/service-account.name: pathos-reader
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pathos-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pathos-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pathos-reader
subjects:
  - kind: ServiceAccount
    name: pathos-reader
    namespace: pathos-reader
